<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ecos da Luz — Criação de Personagem</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap');

:root{
  --bg:#0a0a0a;
  --bg2:#111111;
  --bg3:#1a1a1a;
  --bg4:#222222;
  --gold:#d4a843;
  --gold2:#f0d080;
  --gold-dim:#8a7a40;
  --text:#e8e0d0;
  --text2:#888080;
  --red:#cc4444;
  --radius:10px;
}

body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100dvh}
h1,h2,h3{font-family:'Cinzel',serif;font-weight:700}

#steps{display:flex;justify-content:flex-start;gap:8px;padding:10px 12px;position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--bg4);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#steps::-webkit-scrollbar{display:none}
.step-dot{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;font-family:inherit;background:var(--bg3);color:var(--text2);border:2px solid transparent;transition:.3s;cursor:pointer;box-sizing:border-box}
.step-dot.active{border-color:var(--gold);color:var(--gold);background:var(--bg2)}
.step-dot.done{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.step-dot:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 3px 12px rgba(212,168,67,.3)}
.step-dot:disabled{cursor:not-allowed;opacity:.32}
.step-dot .dot-label{display:none}
@media(min-width:700px){#steps{gap:8px}.step-dot{width:auto;height:auto;border-radius:20px;padding:9px 16px}.step-dot .dot-label{display:inline;font-size:12.5px;margin-left:8px}}

.screen{display:none;padding:16px 18px 24px;max-width:480px;margin:0 auto;animation:fadeIn .3s}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media print{#steps,.btn-group,.btn,.more-btn,.info-btn{display:none!important}.screen{padding:0!important;max-width:100%!important}.result-card{border:1px solid var(--bg4)!important;break-inside:avoid}.stat-card{border:1px solid var(--bg4)!important}.tag{border:1px solid var(--bg4)!important}}

.card-grid{display:grid;gap:10px;margin-top:12px}
.card-grid.c3{grid-template-columns:repeat(3,1fr)}
.card-grid.c2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--bg3);border-radius:var(--radius);padding:12px;border:2px solid transparent;cursor:pointer;transition:.25s;text-align:center}
.card:hover{border-color:var(--gold-dim);background:var(--bg2)}
.card.selected{border-color:var(--gold);background:var(--bg2);box-shadow:0 0 20px rgba(212,168,67,.15)}
.card .icon{font-size:28px;margin-bottom:4px}.card .name{font-weight:600;font-size:14px;color:var(--text)}
.card .sub{font-size:11px;color:var(--text2);margin-top:2px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
.modal-content{background:var(--bg2);border-radius:var(--radius);padding:24px;max-width:440px;width:100%;max-height:80vh;overflow-y:auto;border:1px solid var(--gold-dim)}
.conv-card{background:var(--bg3);border-radius:var(--radius);padding:12px;border:2px solid var(--bg4);cursor:pointer;transition:.25s}
.conv-card:hover{border-color:var(--gold-dim)}
.conv-card.selected{border-color:var(--gold);background:var(--bg2)}
.conv-card.selected.corrupt{border-color:var(--red);background:var(--bg2);box-shadow:0 0 16px rgba(204,68,68,.15)}
.btn{padding:11px 28px;border-radius:50px;font-weight:600;font-size:14px;border:1px solid transparent;cursor:pointer;transition:.25s;display:inline-flex;align-items:center;justify-content:center;letter-spacing:.5px}
.btn-primary{background:var(--gold);color:var(--bg)}
.btn-primary:hover{background:var(--gold2);transform:translateY(-2px)}
.btn-secondary{background:transparent;color:var(--text);border-color:var(--text2)}
.btn-secondary:hover{background:var(--bg3)}
.btn-group{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
.btn-group .btn{flex:1}

.attr-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.attr-label{width:44px;font-weight:600;font-size:13px;color:var(--gold);flex-shrink:0}
.attr-bar{flex:1;height:22px;background:var(--bg3);border-radius:11px;overflow:hidden}
.attr-fill{height:100%;border-radius:11px;transition:.3s;background:linear-gradient(90deg,var(--gold-dim),var(--gold))}
.attr-val{width:48px;text-align:center;font-weight:700;font-size:18px;color:var(--text);line-height:1.1;flex-shrink:0}
.attr-val .racial-badge{display:block;font-size:9px;color:#66dd66;font-weight:600;margin-top:2px;white-space:nowrap}
.attr-mod{width:42px;text-align:center;flex-shrink:0;line-height:1.1}
.attr-mod .mod-num{display:block;font-weight:700;font-size:16px;color:var(--text)}
.attr-mod .mod-sub{display:block;font-size:8.5px;font-weight:500;color:var(--text2);margin-top:1px;white-space:nowrap}
.attr-mod.pos .mod-num{color:#66dd66}
.attr-mod.neg .mod-num{color:#dd6666}
.attr-btns{display:flex;gap:3px}
.attr-btns button{width:26px;height:26px;border-radius:50%;border:1px solid var(--text2);background:var(--bg3);color:var(--text);font-size:16px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
.attr-btns button:hover{background:var(--bg4);border-color:var(--gold)}
.attr-btns button:disabled{opacity:.25;cursor:not-allowed}
.racial-box{background:var(--bg3);border:1px solid var(--bg4);border-radius:10px;padding:10px 12px;font-size:11px;color:var(--gold2);margin-bottom:10px}
.racial-box .rb-title{font-weight:600;color:var(--gold);margin-bottom:6px;font-size:11px}
.racial-box .rb-sub{color:var(--text2);margin:5px 0 0;font-size:10px}
.racial-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.racial-chip{display:inline-flex;align-items:center;gap:2px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--bg4);color:var(--text2);background:var(--bg2);transition:.2s}
.racial-chip:hover{border-color:var(--gold2);color:var(--gold2)}
.racial-chip.on{background:#66dd6622;border-color:#66dd66;color:#66dd66}
.racial-chip.off{opacity:.6}
.racial-chip:disabled{cursor:not-allowed;opacity:.35}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.stat-card{background:var(--bg3);border-radius:var(--radius);padding:14px;text-align:center;border:1px solid var(--bg4)}
.stat-card .stat-val{font-size:24px;font-weight:700;color:var(--gold)}
.stat-card .stat-label{font-size:11px;color:var(--text2);margin-top:2px}

.result-card{background:var(--bg2);border-radius:var(--radius);padding:16px;margin-bottom:10px;border:1px solid var(--bg4)}
.result-card h3{font-size:15px;color:var(--gold);margin-bottom:8px}
.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;font-size:13px}
.result-grid .label{color:var(--text2)}.result-grid .val{font-weight:600;text-align:right}

.points{text-align:center;font-size:16px;font-weight:600;color:var(--gold);margin-bottom:12px}
.title{text-align:center;margin-bottom:10px}
.title h1{font-size:26px;color:var(--gold)}
.title h2{font-size:20px;color:var(--gold)}
.title p{color:var(--text2);font-size:13px}
.fruit-icon{width:70px;height:70px;margin:16px auto;background:radial-gradient(circle at 30% 30%,var(--gold2),var(--gold));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 0 40px rgba(212,168,67,.2)}
.input-name{width:100%;background:transparent;border:none;border-bottom:2px solid var(--text2);padding:10px 0;color:var(--text);font-size:20px;font-family:'Cinzel',serif;text-align:center;outline:none;transition:.3s}
.input-name:focus{border-color:var(--gold)}
.helper{color:var(--text2);font-size:12px;text-align:center;margin-top:4px}

.preset-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.preset-btn{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;background:var(--bg3);color:var(--text2);border:1px solid var(--bg4);cursor:pointer;transition:.2s}
.preset-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.preset-btn:hover{background:var(--bg4)}

.flex-tags{display:flex;flex-wrap:wrap;gap:4px}
.flex-tags .tag{padding:4px 10px;border-radius:16px;font-size:11px;cursor:pointer;border:1px solid var(--bg4);background:var(--bg3);transition:.2s;color:var(--text)}
.flex-tags .tag.selected{border-color:var(--gold);background:var(--bg2)}
.flex-tags .tag.limit{border-color:var(--red);color:var(--red)}
.flex-tags .tag.limit.selected{border-color:var(--red);background:rgba(204,68,68,.15)}

.arch-hint{font-size:11px;color:var(--gold-dim);margin-top:4px;font-style:italic}
.spell-card{background:var(--bg3);border-radius:var(--radius);padding:12px;border:2px solid var(--bg4);cursor:pointer;transition:.25s;margin-bottom:6px}
.spell-card:hover{border-color:var(--gold-dim);background:var(--bg2)}
.spell-card.selected{border-color:var(--gold);background:var(--bg2);box-shadow:0 0 20px rgba(212,168,67,.15)}
.spell-card.disabled{cursor:not-allowed}
.spell-tab{background:var(--bg3);border:1px solid var(--bg4);color:var(--text2);padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;transition:.2s}
.spell-tab:hover{border-color:var(--gold-dim);color:var(--gold2)}
.spell-tab.active{background:var(--bg4);border-color:var(--gold);color:var(--gold)}
.equip-tabs{display:flex;gap:4px;margin-bottom:12px;background:var(--bg2);border-radius:var(--radius);border:1px solid var(--bg4);padding:4px}
.equip-tab{background:var(--bg3);border:1px solid var(--bg4);color:var(--text2);padding:7px 12px;border-radius:var(--radius);font-size:11px;cursor:pointer;transition:.2s;flex:1}
.equip-tab:hover{border-color:var(--gold-dim);color:var(--gold2)}
.equip-tab.active{background:var(--bg4);border-color:var(--gold);color:var(--gold);font-weight:600}
.equipment-section{display:grid;gap:8px}
.equipment-card{background:var(--bg3);border-radius:var(--radius);padding:12px;border:2px solid var(--bg4);cursor:pointer;transition:.25s}
.equipment-card:hover{border-color:var(--gold-dim);background:var(--bg2)}
.equipment-card.selected{border-color:var(--gold);background:var(--bg2);box-shadow:0 0 20px rgba(212,168,67,.15)}
.equipment-card.disabled{cursor:not-allowed;opacity:.45}
.spell-card:hover{border-color:var(--gold-dim)}
.spell-card.selected{border-color:var(--gold);background:var(--bg2)}
.spell-card.disabled{opacity:.4;pointer-events:none}
.calor-bar{display:flex;gap:6px;align-items:center;font-size:11px;margin:4px 0}
 .calor-fill{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--gold-dim),var(--red));transition:.3s;min-width:0}
 .equipment-card{background:var(--bg3);border-radius:var(--radius);padding:12px;border:2px solid var(--bg4);cursor:pointer;transition:.25s;margin-bottom:6px}
 .equipment-card:hover{border-color:var(--gold-dim)}
 .equipment-card.selected{border-color:var(--gold);background:var(--bg2)}
 .equipment-card.disabled{opacity:.45;pointer-events:none}

.realm-card{cursor:pointer}
.realm-card:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

/* ===== Home / Abertura ===== */
.home-shell{display:flex;gap:22px;align-items:stretch;min-height:70vh}
.home-nav{display:flex;flex-direction:column;gap:10px;min-width:210px;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:14px;align-self:stretch}
.home-nav .home-brand{font-family:'Cinzel',serif;color:var(--gold);font-size:13px;letter-spacing:.06em;margin-bottom:4px;line-height:1.4}
.home-nav .home-brand small{display:block;color:var(--text2);font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.02em;font-weight:400;margin-top:2px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);cursor:pointer;text-decoration:none;transition:.2s;text-align:left;font-family:'Inter',sans-serif;font-size:12.5px}
.nav-btn:hover{border-color:var(--gold2);color:var(--gold2);transform:translateX(3px)}
.nav-btn .n-icon{width:18px;text-align:center;font-size:16px}
.nav-btn .n-sub{display:block;font-size:10px;color:var(--text2);margin-top:1px}
.nav-btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1206;border:none;font-weight:700}
.nav-btn.primary:hover{filter:brightness(1.1);color:#1a1206}
.nav-btn.primary .n-sub{color:#4a3a14}
.home-hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:8px 10px}
.home-hero h1{font-family:'Cinzel',serif;font-size:34px;color:var(--gold);letter-spacing:.04em;margin:14px 0 2px}
.home-hero .home-quote{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold-dim);font-size:16px;margin:10px 0 18px;max-width:420px;line-height:1.5}
.home-hero .fruit-icon{width:64px;height:64px;margin:0 auto;font-size:28px}
.home-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:360px}
.home-tags .home-tag{font-size:10px;color:var(--gold2);border:1px solid var(--gold-dim);border-radius:16px;padding:3px 10px;background:var(--bg2)}
@media(max-width:640px){.home-shell{flex-direction:column;gap:16px}.home-nav{min-width:0;flex-direction:row;flex-wrap:wrap}.home-nav .home-brand{display:none}.nav-btn{flex:1;min-width:140px}}
</style>
<script src="spells_data.js"></script>
<script src="spells-data.js"></script>
<script src="equipment_data.js"></script>
</head>
<body>

<div id="steps"></div>
<div id="app"></div>

<script>
// ===== DATA =====
const REALMS = [
  {id:'havendor',name:'Havendor',icon:'⚜️',attr:'Sabedoria',
   phrase:'"Onde a luz encontra a coragem."',
   culture:'Uma civilização de cavaleiros e construtores que acredita na proteção dos fracos. Suas cidades flutuam sobre as nuvens, sustentadas por uma energia radiante que poucos compreendem.',
   lore:'Dizem que o primeiro fragmento caiu aqui, incrustando-se no coração da montanha mais alta. Os havendorianos não adoram o fragmento — eles o estudam, pois acreditam que compreendê-lo é compreender a si mesmos. Sua sociedade é estratificada em ordens: os Portadores da Aurora (cavaleiros), os Forjadores de Luz (artesãos) e os Sussurradores (estudiosos).'},
  {id:'aurivelle',name:'Aurivelle',icon:'🎭',attr:'Carisma',
   phrase:'"A vida é uma canção que nunca termina."',
   culture:'Artistas, músicos e performers. Aqui a expressão é tudo — cada pessoa encontra seu próprio ritmo. As cidades são construídas em florestas vivas, com madeira encantada que reage à música.',
   lore:'O fragmento de Aurivelle caiu em uma clareira onde, dizem, os pássaros cantavam em uníssono. Desde então, a floresta ao redor absorveu essa harmonia. Os aurivellianos não constroem com pedra — usam madeira viva que cresce conforme a música que tocam. Cada pessoa tem uma "melodia pessoal" que reflete sua alma.'},
  {id:'selah',name:'Sélah',icon:'🌄',attr:'Sabedoria',
   phrase:'"No silêncio, encontra-se a resposta."',
   culture:'Monges, meditadores e eremitas. Uma cultura de introspecção e equilíbrio. Não buscam poder — buscam compreensão. Sua arquitetura é minimalista, esculpida nas montanhas.',
   lore:'O fragmento de Sélah não brilha — ele pulsa, como uma respiração. Os selahitas acreditam que o mundo foi criado em ciclos, e que cada pessoa pode aprender a fluir com eles. Seus mosteiros nas montanhas são centros de estudo do "Fluxo da Criação", uma energia que conecta todas as coisas.'},
  {id:'knathi',name:"K'Nahti",icon:'🌿',attr:'Inteligência',
   phrase:'"Tudo floresce no tempo certo."',
   culture:'Uma cultura arbórea e lenta. Grandes árvores-cidades abrigam gerações. Os K\'Nahti não têm pressa — acreditam que apressar é quebrar. Usam uma tinta viva extraída de plantas para criar arte, armas e aliados.',
   lore:'O fragmento de K\'Nahti caiu sobre a maior árvore do mundo, Ydrosyl, e enraizou-se nela. Os K\'Nahti desenvolveram uma relação simbiótica com a árvore — sua seiva é a "Tinta Viva" que usam para criar. Cada K\'Nahti nasce com uma cor de tinta única, que define seu estilo de criar.'},
  {id:'lumivior',name:'Lumivior',icon:'⚙️',attr:'Inteligência',
   phrase:'"A tecnologia é a chave para a alma."',
   culture:'Engenheiros e inventores. Uma sociedade nômade que viaja em cidades-máquina. Não separam vida de máquina — para eles, o éter que move seus motores é a mesma energia que move o corpo.',
   lore:'O fragmento de Lumivior foi encontrado por um mecânico que tentava criar um motor perpétuo. Quando tocou o fragmento, sua máquina ganhou vida. Desde então, os lumivorianos fundiram tecnologia e éter em uma única filosofia: "Energia Vital". Suas cidades são gigantescos mecanismos ambulantes.'},
{id:'neruviah',name:'Neruviah',icon:'🌊',attr:'Carisma',
    phrase:'"As marés mudam, e nós mudamos com elas."',
    culture:'Nômades do mar e do deserto. Adaptam-se a qualquer ambiente seguindo os ciclos da natureza. Sua sociedade é fluida — não têm cidades fixas, apenas caravanas e navios. Passiva: Marés da Alma — estados de espírito que concedem bênçãos situacionais.',
    lore:'O fragmento de Neruviah caiu no oceano e foi encontrado por uma tribo nômade que seguia as baleias. Desde então, eles aprenderam a "sentir" as marés da alma — estados de espírito que trazem diferentes bênçãos. Um neruviano pode mudar sua disposição conforme a situação, como o mar muda suas ondas.'},
{id:'ringendah',name:'Ringendah',icon:'💍',attr:'Inteligência',
    phrase:'"Toda aliança é um portal."',
    culture:'Uma cultura de estudiosos e invocadores. Constroem portais entre lugares distantes usando anéis como chaves. Sua cidade principal, Serafur, é um entrecruzamento de círculos mágicos. Passiva: Afinidade Arcana — +mana máxima e recuperação de mana acelerada. Anéis são elemento cultural (estético, não obrigatório).',
    lore:'O fragmento de Ringendah partiu-se em três anéis antes de cair. Cada anél foi encontrado por um estudioso diferente, e eles discordam sobre como usá-los. Até hoje, os três anéis são mantidos separados, e cada escola de pensamento em Ringendah segue um deles.'},
{id:'argolis',name:'Argolis',icon:'🌙',attr:'Sabedoria',
    phrase:'"Sob as duas luas, a verdade se revela."',
    culture:'Uma sociedade de estrategistas e observadores. Argolis tem duas luas no céu, e seus habitantes desenvolveram uma percepção aguçada do tempo e do espaço. São conhecidos como os melhores analistas táticos do mundo. Passiva: Disciplina Marcial — vantagem em camuflagem, detecção de armadilhas e leitura de ambiente.',
    lore:'O fragmento de Argolis caiu em um deserto de cristal que reflete a luz das duas luas infinitamente. Os argolianos aprenderam a ler padrões em tudo — no movimento das estrelas, nas ondas do deserto, nos passos de um inimigo. Sua "Disciplina Marcial" é lendária.'},
{id:'sphalidor',name:'Sphalidor',icon:'💎',attr:'Constituição',
    phrase:'"O som certo quebra qualquer montanha."',
    culture:'Mineiros e artesãos de cristal. Descobriram que tudo vibra em uma frequência específica. Usam a "Ressonância" para extrair minérios, construir armas e até curar. Suas cavernas-cidades são obras de arte acústica. Passiva: Aço Ressonante — acumulam vibrações (ataque, defesa ou movimento) e gastam para efeitos. Povo nômade de túneis, unido por sintonia vibratória.',
    lore:'O fragmento de Sphalidor foi encontrado nas profundezas de uma caverna, incrustado em um cristal que cantava. Os sphalorianos desenvolveram a "Ressonância" — a arte de vibrar objetos e seres em sua frequência ideal. Um guerreiro sphaloriano pode fazer uma armadura vibrar para torná-la mais resistente, ou uma espada vibrar para cortar melhor.'},
  {id:'valdar',name:'Valdar',icon:'🔥',attr:'Força',group:'caos',cor:'#c0392b',
   phrase:'"Não esconda quem você é. Liberte seus sentimentos e transforme-os em poder."',
   culture:'Um domínio de cinzas e brasas governado pelo Conclave das Cinzas. Os valdarianos acreditam que reprimir emoções é fraqueza: raiva, dor e ressentimento são fontes legítimas de força. Passiva: Fúria — acumula Fúria ao ser alvo de ataques; ao atingir 3, entra em Fúria Ativa.',
   lore:'O Cristal Carmesim é um fragmento primordial corrompido que amplifica emoções intensas e as converte em força sobrenatural. Seu primeiro guardião, o Primeiro Corrompido, foi um herói que queria apenas fazer justiça — cada vitória alimentou sua fúria até ele se tornar o Senhor da Ira. Dizem que ele ainda governa, oculto entre as cinzas do Conclave.'},
  {id:'sataris',name:'Sataris',icon:'🎭',attr:'Carisma',group:'caos',cor:'#8e7cc3',
   phrase:'"Por que permanecer sendo você, quando pode se tornar alguém superior?"',

function skillCapFor(archId,raceId){
  const base=ARCH_SKILL_LIMIT[archId||'']||2;
  const extra=(raceId==='humano'?1:raceId==='meio-elfo'?2:0);
  return base+extra;
}
function suggestedFor(archId,raceId,realmId){
  const base=ARCH_SKILLS[archId]||[];
  const racial=RACE_SKILLS[raceId]||[];
  const realmS=REALM_SKILLS[realmId]||[];
  return [...new Set([...base,...racial,...realmS])];
}
function suggestedSkills(){
  return suggestedFor(state.archetype,state.race,state.realm);
}
function toggleSkill(id){
  const arch=ARCHETYPES.find(a=>a.id==state.archetype);
  const race=RACES.find(r=>r.id==state.race);
  const cap=skillCapFor(arch&&arch.id,race&&race.id);
  const arr=[...(state.skills||[])];
  const i=arr.indexOf(id);
  if(i>=0)arr.splice(i,1);
  else if(arr.length<cap)arr.push(id);
  state.skills=arr;
  render();
}
const SIMPLE_WEAPONS=['clava','adaga','grande-clava','machadinha','dardo','azagaia','maça','bordão','foice','funda','martelo-leve','lança','besta-leve','ataque-desarmado'];

  guerreiro:{all:true},
  baluarte:{all:true},
  vigilante:{simple:true,extra:['rapieira','cimitarra','espada-curta','arco-curto','besta-mao','chicote','rede']},

const ARCH_ARMOR_PROF={
  guerreiro:['leve','media','pesada','escudo'],
  baluarte:['leve','media','pesada','escudo'],
  vigilante:['leve','media','escudo'],
  arcanista:['leve'],
  creator:['leve','media','escudo'],
};
function weaponProficient(archId,w){
  const p=ARCH_WEAPON_PROF[archId||''];
  if(!p)return false;
  if(p.all)return true;
  if(p.simple&&SIMPLE_WEAPONS.includes(w.id))return true;
  return (p.extra||[]).includes(w.id);
}
function armorAllowedFor(archId){return ARCH_ARMOR_PROF[archId||'']||['leve'];}
function armorProficient(archId,armor){
  if(!armor||armor.id==='sem-armadura')return true;
  return armorAllowedFor(archId).includes(armor.type);
}

  `).join('');
  document.getElementById('app').innerHTML=`<div class="screen active">${screens[s]()}</div>`;
}

            ${r.group=='caos'?`<span style="font-size:9px;text-transform:uppercase;letter-spacing:.1em;background:#c0392b33;color:#ff8a7a;border:1px solid #c0392b;border-radius:10px;padding:2px 8px;display:inline-block;margin-top:2px">☠️ Caos</span>`:''}
            <div class="sub" style="font-style:italic;color:var(--gold-dim);font-size:10px;line-height:1.2">${r.phrase}</div>

      </div>
      ${selRealm?`
        <div id="realmDetail" style="margin-top:14px;background:var(--bg2);border-radius:var(--radius);padding:16px;border:1px solid var(--bg4);animation:fadeIn .3s;scroll-margin-top:64px">
          <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:8px">
            <span style="font-size:32px">${selRealm.icon}</span>
            <div style="flex:1;min-width:0">
              <div style="font-weight:700;font-size:17px;color:${selRealm.cor};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${selRealm.name}</div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">
                <span style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:${selRealm.cor};background:color-mix(in srgb,${selRealm.cor} 15%,transparent);border:1px solid ${selRealm.cor};padding:2px 8px;border-radius:8px">${selRealm.virtude}</span>
                ${selRealm.group==='caos'?`<span style="font-size:9px;background:#c0392b33;color:#ff8a7a;border:1px solid #c0392b;border-radius:8px;padding:2px 8px">☠️ Domínio do Caos</span>`:''}
              </div>
            </div>
          </div>
          <p style="font-style:italic;font-size:12px;color:var(--gold-dim);line-height:1.4;margin-bottom:8px">"${selRealm.phrase}"</p>
          <p style="font-size:11px;color:var(--text);line-height:1.5;margin-bottom:10px">${selRealm.culture}</p>
          <div style="font-size:11px;color:var(--gold2);background:var(--bg3);border:1px solid var(--bg4);border-radius:8px;padding:10px 12px">
            <strong>✨ Passiva Nv 1 — ${PASSIVES[selRealm.id]?.nome||'—'}</strong>
            <p style="color:var(--text2);margin-top:4px;font-size:10px;line-height:1.4">${PASSIVES[selRealm.id]?.desc||'—'}</p>
          </div>
          <button class="more-btn" style="margin-top:8px;background:none;border:none;color:var(--gold);font-size:12px;cursor:pointer;padding:4px 0" onclick="openLore('${selRealm.id}')">📖 Ler a história completa →</button>
        </div>
      `:''}
      ${state.loreRealm?loreModal(state.loreRealm):''}
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="go(1)">Voltar</button>
        <button class="btn btn-primary" onclick="go(3)" ${!state.realm?'disabled':''}>Próximo →</button>
      </div>`;
  },

  // 3 Archetype
  ()=>{
    const realm=REALMS.find(r=>r.id==state.realm);
    return `<div class="title"><h2>Escolha seu Caminho</h2><p>Como você enfrenta o mundo</p></div>
      ${ARCHETYPES.map(a=>{
        const sel=state.archetype==a.id;
        const ex=a.ex.find(e=>e.reino==state.realm);
        return `<div class="card ${sel?'selected':''}" onclick="select('archetype','${a.id}')" style="display:flex;align-items:center;text-align:left;padding:14px;margin-bottom:8px;gap:12px">
          <div style="font-size:30px">${a.icon}</div>
          <div style="flex:1">
            <div class="name" style="font-size:15px">${a.name}</div>
            <div class="sub" style="margin-top:2px">${a.function}</div>
            <div style="margin:4px 0;display:flex;gap:6px">
              <span style="font-size:10px;background:var(--bg4);padding:2px 8px;border-radius:10px">PV ${a.pvd}</span>
              <span style="font-size:10px;background:var(--bg4);padding:2px 8px;border-radius:10px">Mana ×${a.manaBase}</span>
            </div>
            ${ex?`<div class="arch-hint">Ex: ${ex.exemplo}</div>`:''}
            ${sel?`<p style="font-size:11px;color:var(--text2);margin-top:6px;line-height:1.4">${a.desc}</p>`:''}
            ${sel&&state.realm?pathBox(a.id,state.realm):''}
          </div>
        </div>`;
      }).join('')}
    <div class="btn-group">
      <button class="btn btn-secondary" onclick="go(2)">Voltar</button>
      <button class="btn btn-primary" onclick="go(4)" ${!state.archetype?'disabled':''}>Próximo →</button>
    </div>`;
  },

  // 4 Race
  ()=>`
    <div class="title"><h2>Escolha sua Raça</h2><p>Sua herança e biologia</p></div>
    <div class="card-grid c3">
      ${RACES.map(r=>`
        <div class="card ${state.race==r.id?'selected':''}" onclick="select('race','${r.id}')">
          <div class="icon">${r.icon}</div>
          <div class="name">${r.name}</div>
          <div class="sub">${r.stats}</div>
          <button style="margin-top:6px;background:none;border:1px solid var(--bg4);color:var(--gold);font-size:10px;border-radius:10px;padding:2px 8px;cursor:pointer" onclick="event.stopPropagation();openRaceModal('${r.id}')">ℹ️ Detalhes</button>
        </div>
      `).join('')}
    </div>
    ${state.raceModal?raceModal(state.raceModal):''}
    <div class="btn-group">
      <button class="btn btn-secondary" onclick="go(3)">Voltar</button>
        <button class="btn btn-primary" onclick="go(5)" ${!state.race?'disabled':''}>Próximo →</button>
    </div>
  `,

  // 5 Attributes
  ()=>{
    const arch=ARCHETYPES.find(a=>a.id==state.archetype);
    if(!arch){
      return `<div class="title"><h2>Atributos</h2><p>Escolha seu <strong>Caminho</strong> (etapa 3) para distribuir os atributos.</p></div>
        <div class="btn-group"><button class="btn btn-primary" onclick="go(3)">Ir para Caminho →</button></div>`;
    }
    const preset=ATTR_PRESETS[state.archetype];
    const usePreset=state.attrMode=='preset';
    const a=usePreset?{...preset}:state.attrs;
    if(Object.keys(state.attrs).length==0&&state.attrMode=='manual')state.attrs={for:8,des:8,con:8,int:8,sab:8,car:8};
    if(usePreset)Object.assign(state.attrs,preset);

    const race=RACES.find(r=>r.id==state.race);
    const pickSpec=racePickSpec(race&&race.stats);
    if(pickSpec&&!(state.racePicks||[]).length)state.racePicks=defaultRacePicks(race);
    const racial=race?racialEffective(race,state.racePicks):{for:0,des:0,con:0,int:0,sab:0,car:0};

    const baseCost=v=>ATTR_COST[v]||0;
    const spent=baseCost(a.for)+baseCost(a.des)+baseCost(a.con)+baseCost(a.int)+baseCost(a.sab)+baseCost(a.car);
    const remaining=27-spent;
    const canUp=v=>v<15&&remaining>0;
    const canDown=v=>v>8;
    const mod=v=>Math.floor((v-10)/2);
    const names={for:'FOR',des:'DES',con:'CON',int:'INT',sab:'SAB',car:'CAR'};

    return `<div class="title"><h2>Atributos</h2><p>Distribua ${remaining<0?0:remaining} pontos (27 base) — bônus racial aplicado à parte</p></div>
      ${race?`<div class="racial-box">
        <div class="rb-title">🧬 Bônus Racial — ${race.icon} ${race.name}</div>
        ${pickSpec?`
          <div class="racial-chips">${['for','des','con','int','sab','car'].map(k=>{
            const on=(state.racePicks||[]).includes(k);
            const dis=!on&&(state.racePicks||[]).length>=pickSpec.pick;
            return `<button type="button" class="racial-chip ${on?'on':'off'}" onclick="toggleRacePick('${k}')" ${dis?'disabled':''}>${k.toUpperCase()} +${pickSpec.pickVal}</button>`;
          }).join('')}</div>
          <div class="rb-sub">Toque os atributos que recebem +${pickSpec.pickVal} · escolha ${pickSpec.pick} de 6 — selecionados: <strong style="color:var(--gold2)">${(state.racePicks||[]).length}/${pickSpec.pick}</strong></div>
        `:Object.entries(racial).filter(([,v])=>v!==0).map(([k,v])=>`<span class="racial-chip on" style="cursor:default">${k.toUpperCase()} ${v>0?'+':''}${v}</span>`).join('')}
      </div>`:''}
      <div class="preset-bar">
        <button class="preset-btn ${usePreset?'active':''}" onclick="applyPreset()">✦ ${arch.name} Padrão</button>
        <button class="preset-btn ${!usePreset?'active':''}" onclick="editManual()">✎ Editar Manual</button>
      </div>
      <div class="points">${Math.max(0,remaining)} pontos restantes (base)</div>
      ${Object.keys(names).map(k=>{
        const total=mod(a[k]+racial[k]);
        return `<div class="attr-row">
          <div class="attr-label">${names[k]}</div>
          <div class="attr-bar"><div class="attr-fill" style="width:${Math.min(100,(a[k]-8)/7*100)}%"></div></div>
          <div class="attr-val">${a[k]+racial[k]}${racial[k]!==0?`<span class="racial-badge">base ${a[k]} · raça ${racial[k]>0?'+':''}${racial[k]}</span>`:''}</div>
          <div class="attr-mod ${total>=0?'pos':'neg'}"><span class="mod-num">${total>=0?'+':''}${total}</span></div>
          <div class="attr-btns">
            <button onclick="adjAttr('${k}',-1)" ${canDown(a[k])?'':'disabled'}>−</button>
            <button onclick="adjAttr('${k}',1)" ${canUp(a[k])?'':'disabled'}>+</button>
          </div>
        </div>`;
      }).join('')}
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="go(4)">Voltar</button>
        <button class="btn btn-primary" onclick="go(6)">Magias →</button>
      </div>`;
  },

  // 6 Magias — Abas por Círculo
  ()=>{
    const arch=ARCHETYPES.find(a=>a.id==state.archetype);
    if(!arch){
      return `<div class="title"><h2>Magias</h2><p>Escolha seu <strong>Caminho</strong> (etapa 3) para selecionar magias.</p></div>
        <div class="btn-group"><button class="btn btn-primary" onclick="go(3)">Ir para Caminho →</button></div>`;
    }
    const realm=REALMS.find(r=>r.id==state.realm);
    const nv=state.level||3;
    const spellsKnown=getSpellsKnown(arch.id,nv);
    const sk=spellsKnown;

    const sc=state.spells.cantrip.length;
    const sl=state.spells.leveled.length;
    const totalLeveledLimit=Object.entries(sk).filter(([k])=>k!='cantrip').reduce((a,[,v])=>a+v,0);

    const maxCircleArchetype={arcanista:9,creator:7,vigilante:5,baluarte:4,guerreiro:3}[arch.id]||3;
    const maxCircleByLevel=Math.floor((nv+1)/2);
    const maxCircle=Math.min(maxCircleArchetype,maxCircleByLevel);

    const circles=[0];
    for(let c=1;c<=maxCircle;c++)circles.push(c);
    if(!circles.includes(state.spellTab))state.spellTab=0;

    const circleShort={0:'🪄 Truques',1:'1º',2:'2º',3:'3º',4:'4º',5:'5º',6:'6º',7:'7º',8:'8º',9:'9º'};
    const spellsByCircle={};
    circles.forEach(c=>{spellsByCircle[c]=ALL_SPELLS.filter(s=>s.c===c);});
    const isTruque = state.spellTab===0;
    const arr=isTruque?state.spells.cantrip:state.spells.leveled;
    const lim=isTruque?sk.cantrip:totalLeveledLimit;
    const spellsInTab=spellsByCircle[state.spellTab]||[];

    const spellCard=(s)=>{
      const sel=arr.includes(s.id);
      const disabled=!sel&&arr.length>=lim;
      return `<div class="spell-card ${sel?'selected':''} ${disabled?'disabled':''}" style="text-align:left;padding:10px;margin-bottom:0;opacity:${disabled?.45:1}" onclick="${disabled?'':`toggleSpell('${s.id}')`}" role="button" tabindex="0">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:4px">
          <span style="font-weight:600;font-size:12.5px;line-height:1.3;color:var(--gold2)">${s.n}</span>
          <button style="flex-shrink:0;background:var(--bg4);border:none;color:var(--gold2);width:20px;height:20px;border-radius:50%;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center" onclick="event.stopPropagation();openSpellModal('${s.id}')" title="Ver detalhes da magia">ⓘ</button>
        </div>
        <p style="font-size:10px;color:var(--text2);margin:2px 0;line-height:1.2">${s.o} · ${s.s}</p>
        <div style="display:flex;gap:4px;font-size:10px;margin-top:4px">
          <span style="background:var(--bg4);padding:1px 6px;border-radius:6px;color:var(--gold)">${s.m}PM</span>
          <span style="background:var(--bg4);padding:1px 6px;border-radius:6px;color:${s.cal>0?'var(--red)':'var(--text2)'}">🔥${s.cal}</span>
        </div>
      </div>`;
    };

    const calorLimit=Math.max(3,3+Math.floor((state.attrs.con-10)/2));

    const renderTab=(c)=>{
      const label=circleShort[c]||c+'º';
      const count=spellsByCircle[c]?.length||0;
      const active=state.spellTab===c;
      return `<button class="spell-tab ${active?'active':''}" onclick="state.spellTab=${c};render()" title="${count} magias">${label}</button>`;
    };

    return `<div class="title"><h2>🔮 Magias</h2><p>Nv ${nv} · ${arch?.name||'?'} · Círculo máx: ${maxCircle}º</p></div>
      <div style="margin-bottom:10px;background:var(--bg2);border-radius:var(--radius);padding:10px 12px;border:1px solid var(--bg4);font-size:11px;line-height:1.4">
        <strong style="color:var(--gold)">📐 Calor Mágico:</strong> Cada magia de 1º+ gera Calor = círculo.<br>
        <strong>Limite:</strong> ${calorLimit} (3 + CON) · Dissipa 1/turno · Zera em descanso curto<br>
        <strong style="color:var(--red)">Acima do limite:</strong> crítico (+dano) → sobrecarga (+dano em si).
      </div>
      <div style="margin-bottom:12px;background:var(--bg2);border-radius:var(--radius);padding:8px 12px;border:1px solid var(--bg4);font-size:11px">
        <span style="color:var(--gold)">🪄 Truques:</span> ${sc}/${sk.cantrip} · 
        <span style="color:var(--gold)">Niveladas:</span> ${sl}/${totalLeveledLimit}
      </div>
      <div class="spell-tabs" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;padding:4px;background:var(--bg2);border-radius:var(--radius);border:1px solid var(--bg4)">
        ${circles.map(renderTab).join('')}
      </div>
      <div class="points" style="font-size:13px;margin-bottom:6px">${isTruque?'Truques':'Magias '+circleShort[state.spellTab]}: ${arr.filter(id=>spellsInTab.some(s=>s.id==id)).length} selecionadas · ${lim - arr.length >= 0 ? lim-arr.length : 0} vagas</div>
      <div class="card-grid c2" style="gap:8px">
      ${spellsInTab.map(s=>spellCard(s)).join('')}
      </div>
      ${state.spellModal?spellModal(state.spellModal):''}
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="go(5)">← Atributos</button>
        <button class="btn btn-primary" onclick="go(7)">Equipamento →</button>
      </div>`;
  },

  // 7 Equipment — Abas com Restrições de Classe
  ()=>{
    const selectedWeapons=state.equipment.weapons;
    const theme=EQUIPMENT_THEMES[state.realm]||EQUIPMENT_THEMES.havendor;
    const arch=ARCHETYPES.find(a=>a.id==state.archetype);
    if(!arch){
      return `<div class="title"><h2>Equipamento</h2><p>Escolha seu <strong>Caminho</strong> (etapa 3) para equipar seu personagem.</p></div>
        <div class="btn-group"><button class="btn btn-primary" onclick="go(3)">Ir para Caminho →</button></div>`;
    }
    if(!state.equipTab)state.equipTab='armas';
    const armorAllowed=armorAllowedFor(arch.id);
    const weaponCard=w=>{const ok=weaponProficient(arch.id,w);return `<div class="equipment-card ${selectedWeapons.includes(w.id)?'selected':''}" onclick="toggleWeapon('${w.id}')">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:600;color:var(--gold2)">${w.name}</span><span style="font-size:11px;color:var(--gold)">${w.damage}</span></div>
      <p style="font-size:10px;color:var(--text2);margin-top:3px">${w.type} · ${w.range} · ${w.props.join(', ')||'sem propriedades'}</p>
      <p style="font-size:9px;margin-top:3px;${ok?'color:#66dd66':'color:var(--red)'}">${ok?'✔ Proficiente':'✘ Sem proficiência (ataque sem bônus de prof)'}</p>
    </div>`;};
    const armorCard=a=>{
      const allowed=armorAllowed.includes(a.type)||(a.id==='sem-armadura');
      const disabled=!allowed&&state.equipment.armor!==a.id;
      return `<div class="equipment-card ${state.equipment.armor===a.id?'selected':''} ${disabled?'disabled':''}" onclick="${disabled?'':`selectArmor('${a.id}')`}" title="${!allowed?'Seu arquétipo não pode usar esta armadura':''}">
        <div style="display:flex;justify-content:space-between"><span style="font-weight:600;color:${disabled?'var(--text2)':'var(--gold2)'}">${a.name}</span><span style="font-size:11px;color:var(--gold)">${a.base?a.base+' CA':'DES total'}</span></div>
        <p style="font-size:10px;color:var(--text2);margin-top:3px">${a.type}${a.dexCap===null?' · DES sem limite':a.dexCap===0?' · não soma DES':' · DES máx. +'+a.dexCap}${!allowed?' ⛔':' '}</p>
      </div>`;
    };
    const tabs=['armas','armadura','escudo'];
    const tabLabel={armas:'⚔️ Armas',armadura:'🛡️ Armadura',escudo:'🛡️ Escudo'};
    return `<div class="title"><h2>⚔️ Equipamento</h2><p>Escolha até 2 armas, uma armadura e um escudo</p></div>
      <div style="margin-bottom:12px;background:var(--bg2);border-radius:var(--radius);padding:10px 12px;border:1px solid var(--bg4);font-size:11px;line-height:1.4"><strong style="color:var(--gold)">${theme.label}</strong> · ${theme.material}<br><span style="color:var(--text2)">O equipamento mantém as regras abaixo, mas pode assumir a aparência e a tradição de ${REALMS.find(r=>r.id===state.realm)?.name||'seu Reino'}.</span></div>
      <div class="equip-tabs" style="display:flex;gap:4px;margin-bottom:12px;background:var(--bg2);border-radius:var(--radius);border:1px solid var(--bg4);padding:4px">
        ${tabs.map(t=>`<button class="equip-tab ${state.equipTab===t?'active':''}" onclick="state.equipTab='${t}';render()">${tabLabel[t]}</button>`).join('')}
      </div>
      ${state.equipTab==='armas'?`
        <div class="equipment-section"><p style="font-size:12px;color:var(--gold);font-weight:600;margin-bottom:8px">Armas (${selectedWeapons.length}/2)</p>
        ${WEAPONS.map(weaponCard).join('')}</div>
      `:''}
      ${state.equipTab==='armadura'?`
        <div class="equipment-section"><p style="font-size:12px;color:var(--gold);font-weight:600;margin-bottom:8px">Armadura ${armorAllowed.includes('pesada')?'':'(leve/média apenas)'}</p>
        ${ARMOR.map(armorCard).join('')}</div>
      `:''}
      ${state.equipTab==='escudo'?`
        <div class="equipment-section"><p style="font-size:12px;color:var(--gold);font-weight:600;margin-bottom:8px">Escudo ${armorAllowed.includes('escudo')?'':'(não permitido)'}</p>
        <div class="equipment-card ${state.equipment.shield?'selected':''} ${!armorAllowed.includes('escudo')?'disabled':''}" onclick="${armorAllowed.includes('escudo')?`state.equipment.shield=!state.equipment.shield;render()`:''}" title="${!armorAllowed.includes('escudo')?'Seu arquétipo não pode usar escudo':''}">
          <div style="display:flex;justify-content:space-between"><span style="font-weight:600;color:${!armorAllowed.includes('escudo')?'var(--text2)':'var(--gold2)'}">Escudo</span><span style="font-size:11px;color:var(--gold)">+2 CA</span></div>
          <p style="font-size:10px;color:var(--text2);margin-top:3px">Requer uma mão livre${!armorAllowed.includes('escudo')?' ⛔':''}</p>
        </div>
      `:''}
      <div class="btn-group"><button class="btn btn-secondary" onclick="go(6)">← Magias</button><button class="btn btn-primary" onclick="go(8)">Perícias →</button></div>`;
  },

  // 8 Perícias
  ()=>{
    const arch=ARCHETYPES.find(a=>a.id==state.archetype);
    const race=RACES.find(r=>r.id==state.race);
    const realm=REALMS.find(r=>r.id==state.realm);
    const allSkills=[
      {id:'acrobacia',nome:'Acrobacia',attr:'DES',desc:'Equilíbrio, saltos, quedas'},
      {id:'arcanismo',nome:'Arcanismo',attr:'INT',desc:'Conhecimento mágico, identificação de magias'},
      {id:'atletismo',nome:'Atletismo',attr:'FOR',desc:'Escalar, nadar, saltar, empurrar'},
      {id:'cavalgar',nome:'Cavalgar',attr:'SAB',desc:'Montar, controlar bestas'},
      {id:'conhecimento',nome:'Conhecimento',attr:'INT',desc:'História, geografia, leis, nobres'},
      {id:'enganação',nome:'Enganação',attr:'CAR',desc:'Mentir, disfarçar, falsificar'},
      {id:'furtividade',nome:'Furtividade',attr:'DES',desc:'Mover-se sem ser visto/ouvido'},
      {id:'intimidação',nome:'Intimidação',attr:'CAR',desc:'Ameaçar, coagir, impor presença'},
      {id:'intuição',nome:'Intuição',attr:'SAB',desc:'Detectar mentiras, ler intenções'},
      {id:'investigação',nome:'Investigação',attr:'INT',desc:'Buscar pistas, analisar evidências'},
      {id:'medicina',nome:'Medicina',attr:'SAB',desc:'Estabilizar, diagnosticar, tratar venenos'},
      {id:'natureza',nome:'Natureza',attr:'SAB',desc:'Flora, fauna, clima, sobrevivência'},
      {id:'percepção',nome:'Percepção',attr:'SAB',desc:'Notar detalhes, ouvir, cheirar'},
      {id:'performance',nome:'Performance',attr:'CAR',desc:'Atuar, música, dança, oratória'},
      {id:'persuasão',nome:'Persuasão',attr:'CAR',desc:'Convencer, negociar, diplomacia'},

      guerreiro:['atletismo','intimidação','percepção','sobrevivência','cavalgar'],

      creator:['tecnologia','investigação','conhecimento','tatuagem','performance'],

      humano:['persuasão'], elfo:['percepção'], anao:['conhecimento'], halfling:['furtividade'],
      gnomo:['investigação'], 'meio-elfo':['persuasão'], bestial:['percepção'], anfibio:['sobrevivência'],
      reptiliano:['intimidação'], heavens:['religião'], auris:['performance'], 'elfo-deserto':['sobrevivência'],
      marmoreano:['conhecimento'], etherborn:['tecnologia'], neru:['intuição'], argoliano:['investigação'],
      'elfo-negro':['furtividade'], 'anao-sphalidor':['conhecimento'], 'filhos-da-furia':['atletismo'],
      noctari:['enganação'], pelned:['persuasão'], insectoide:['sobrevivência'],
    };
    const realmSkills={
      havendor:['religião'], aurivelle:['performance'], selah:['intuição'], knathi:['tatuagem'],
      lumivior:['tecnologia'], neruviah:['intuição'], ringendah:['arcanismo'], argolis:['investigação'],
      sphalidor:['conhecimento'], valdar:['atletismo'], sataris:['enganação'], morvath:['intimidação'],
      mavaron:['persuasão'], taevora:['performance'], morpheia:['intuição'], hybris:['performance'],
    };
    const base=ARCH_SKILLS[arch&&arch.id]||[];
    const racial=RACE_SKILLS[race&&race.id]||[];
    const realmS=REALM_SKILLS[state.realm]||[];
    const combined=suggestedSkills();
    const prof=state.skills||[];
    const cap=skillCapFor(arch&&arch.id,race&&race.id);
    const profBonus=2+Math.floor((state.level-1)/4);
    const racialS=race?racialEffective(race,state.racePicks):{for:0,des:0,con:0,int:0,sab:0,car:0};
    return `<div class="title"><h2>🎯 Perícias</h2><p>Escolha suas perícias treinadas — bônus de proficiência (+${profBonus})</p></div>

        </div>`:`<p style="font-size:10px;color:var(--text2);margin-top:4px">Toque para escolher · "Mais detalhes" mostra o que significa</p>`}

      <h2>⚖️ Convicções e Corrupções</h2>
      <p>A bússola moral do personagem — escolha com liberdade</p>
    </div>
    <div style="margin-bottom:12px;background:var(--bg2);border-radius:var(--radius);padding:12px;border:1px solid var(--bg4);font-size:11px;line-height:1.6">
      <div style="font-weight:600;color:var(--gold);margin-bottom:6px">🪞 Como jogar a Bússola Moral</div>
      <p style="color:var(--text);margin:0">Convicções e corrupções são <strong>guias de roleplay</strong> — colorem o jeito do personagem e o rumo que ele tende a seguir. Nada aqui obriga: a decisão é sempre sua.</p>
      <p style="color:var(--text2);margin:6px 0 0">
        ⚖️ <strong style="color:var(--gold)">Convicção</strong> — o que você <em>quer ser</em>.<br>
        🩸 <strong style="color:var(--red)">Corrupção</strong> — o que <em>é mais fácil de ser</em>.<br>
        ➖ <strong>Neutro</strong> — quando nenhuma puxa, você escolhe livre.

    ${isChaos?`<div style="margin-bottom:10px;background:#c0392b1a;border:1px solid #c0392b;border-radius:var(--radius);padding:8px 10px;font-size:11px;color:#ff8a7a">☠️ <strong>Domínio do Caos</strong> — a corrupção pesa mais aqui: escolha <strong>2 convicções</strong> e <strong>3 corrupções</strong>.</div>`:''}

      <div class="card-grid c2" style="gap:8px;margin-top:0">
        ${cKeys.map(k=>convCard(k,state.convic.includes(k))).join('')}

    </div>
    <div style="margin-bottom:12px">
      <p style="font-size:12px;color:var(--red);font-weight:600;margin-bottom:8px">Corrupções (escolha ${tLim})</p>
      <p style="font-size:11px;color:var(--text2);margin-bottom:10px">Fraquezas que seu personagem carrega, mesmo que tente esconder.</p>
      <div class="card-grid c2" style="gap:8px;margin-top:0">
        ${tKeys.map(k=>corrCard(k,state.tempt.includes(k))).join('')}
      </div>
    </div>
    <div class="btn-group">
        <button class="btn btn-secondary" onclick="go(8)">← Perícias</button>
        <button class="btn btn-primary" onclick="go(10)" ${state.convic.length<cLim||state.tempt.length<tLim?'disabled':''}>Ver Ficha →</button>
    </div>`;
  },

  // 10 Final Sheet
  ()=>{
    const race=RACES.find(r=>r.id==state.race);
    const realm=REALMS.find(r=>r.id==state.realm);
    const arch=ARCHETYPES.find(a=>a.id==state.archetype);
    if(!arch){
      return `<div class="title"><h2>Ficha do Personagem</h2><p>Complete as etapas anteriores (pelo menos o <strong>Caminho</strong>) para montar sua ficha.</p></div>

    }
    const a=state.attrs;
    const mod=v=>Math.floor((v-10)/2);
    const intMod=mod(a.int),conMod=mod(a.con),dexMod=mod(a.des),sabMod=mod(a.sab),forMod=mod(a.for),carMod=mod(a.car);
    const nv=state.level||3;
    const base=arch.manaBase;
    const mana=Math.max(3,nv+intMod)*base;
    const pv=arch.pv+conMod+(nv-1)*(arch.pvavg+conMod);
     const armor=ARMOR.find(item=>item.id===state.equipment.armor)||ARMOR[0];
     const armorDex=armor.dexCap===null?dexMod:Math.min(dexMod,armor.dexCap);
     const ca=(armor.id==='sem-armadura'?10:armor.base)+armorDex+(state.equipment.shield?SHIELD.ac:0);
     const prof=2+Math.floor((nv-1)/4);
    const inic=dexMod;

    const racial=race?racialEffective(race,state.racePicks):{for:0,des:0,con:0,int:0,sab:0,car:0};
    const calorLimit=Math.max(3,3+Math.floor((state.attrs.con-10)/2));
    const profBonus=2+Math.floor((state.level-1)/4);

    return `<div class="title"><h2>${state.name||'Herói'}</h2><p style="font-size:12px">Nv ${nv} · ${race?.icon} ${race?.name||'?'} · ${realm?.icon} ${realm?.name||'?'} · ${arch?.icon} ${arch?.name||'?'}</p></div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-val">${nv}</div><div class="stat-label">Nível</div></div>

      </div>
      <div class="result-card"><h3>Atributos</h3><div class="result-grid">
        ${['for','des','con','int','sab','car'].map(k=>`<span class="label">${k.toUpperCase()}</span><span class="val">${a[k]} ${racial[k]!==0?`<span style="color:#66dd66">+${racial[k]}</span>`:''} = <strong>${a[k]+racial[k]}</strong> (${mod(a[k]+racial[k])>=0?'+':''}${mod(a[k]+racial[k])})</span>`).join('')}
      </div></div>
       <div class="result-card"><h3>Origem · Caminho · Raça</h3><div class="result-grid">
        <span class="label">Origem</span><span class="val">${realm?.icon||''} ${realm?.name||'—'}</span>
        <span class="label">Caminho</span><span class="val">${arch?.icon||''} ${arch?.name||'—'}</span>
        <span class="label">Raça</span><span class="val">${race?.icon||''} ${race?.name||'—'}</span>
       </div></div>
       ${race?`
       <div class="result-card">
         <h3>${race.icon} Raça — ${race.name}</h3>
         <p style="font-size:11px;color:var(--text2);margin-bottom:8px;line-height:1.5">${race.saber||race.desc}</p>
         <div style="font-size:11px;color:var(--gold);font-weight:600;margin-bottom:6px">Bônus Raciais</div>
         <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">
           ${Object.entries(racial).filter(([,v])=>v!==0).map(([k,v])=>`<span style="background:#66dd6622;border:1px solid #66dd66;padding:3px 10px;border-radius:6px;font-size:10px;color:#66dd66">${k.toUpperCase()} ${v>0?'+':''}${v}</span>`).join('')}

       </div>`:''}
       ${pathSheet(state.archetype,state.realm)}
       <div class="result-card"><h3>⚔️ Equipamento</h3><div class="result-grid">
         <span class="label">Armadura</span><span class="val">${armor.name}</span>

         <span class="label">CA final</span><span class="val">${ca}</span>
       </div>
       <div style="margin-top:10px;display:grid;gap:6px">
         ${state.equipment.weapons.length?state.equipment.weapons.map(id=>{const w=WEAPONS.find(item=>item.id===id);const ok=weaponProficient(state.archetype,WEAPONS.find(x=>x.id===id));
         const ability=mod(a[w.ability])+(ok?prof:0);
         return `<div style="background:var(--bg3);padding:8px;border-radius:8px;font-size:12px"><strong style="color:var(--gold2)">${w.name}</strong> <span style="font-size:9px;${ok?'color:#66dd66':'color:var(--red)'}">${ok?'✔ Prof':'✘ Sem prof'}</span><br><span style="color:var(--text2)">${w.damage} ${w.type} · Ataque ${ability>=0?'+':''}${ability} · Dano ${w.damage}${w.damage.includes('FOR')?'':' '+(mod(a[w.ability])>=0?'+':'')+mod(a[w.ability])}</span></div>`}).join(''):'<span style="color:var(--text2);font-size:12px">Nenhuma arma selecionada</span>'}
       </div></div>
      <div class="result-card"><h3>🎯 Perícias</h3><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
        ${(state.skills||[]).map(s=>{const sm=Math.floor((a[SKILL_ATTR[s]]+(racial[SKILL_ATTR[s]]||0)-10)/2);const st=sm+profBonus;return `<span style="background:var(--bg3);padding:4px 12px;border-radius:20px;font-size:12px;border:1px solid var(--gold-dim);color:var(--gold)">${SKILL_NAMES[s]||s} <span style="color:var(--text);font-weight:700">${st>=0?'+':''}${st}</span></span>`;}).join('')||'<span style="color:var(--text2);font-size:12px">Nenhuma</span>'}
      </div></div>
      <div class="result-card"><h3>Mana</h3><div class="result-grid">
        <span class="label">Fórmula</span><span class="val">(Nv ${nv} + ${intMod>=0?'+':''}${intMod}) × ${base}</span>
        <span class="label">Total</span><span class="val">${mana}</span>
        <span class="label">Calor (limite)</span><span class="val" style="color:var(--red)">🔥 ${calorLimit}</span>
      </div></div>
      <div class="result-card">
        <h3>⚖️ Convicções</h3>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
          ${state.convic.map(c=>`<span style="background:var(--bg3);padding:4px 12px;border-radius:20px;font-size:12px;border:1px solid var(--gold-dim);color:var(--gold)">${c}</span>`).join('')}
        </div>
      </div>
      <div class="result-card">
        <h3>⚠️ Corrupções</h3>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
          ${state.tempt.map(t=>`<span style="background:var(--bg3);padding:4px 12px;border-radius:20px;font-size:12px;border:1px solid var(--red);color:var(--red)">${t}</span>`).join('')}
        </div>
      </div>
      ${state.spells.cantrip.length||state.spells.leveled.length?`
      <div class="result-card">
        <h3>🔮 Magias</h3>
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">
          ${[...state.spells.cantrip,...state.spells.leveled].map(id=>{
            const s=getSpellById(id);
            return s?`<span style="background:var(--bg3);padding:3px 10px;border-radius:16px;font-size:11px;border:1px solid var(--gold-dim);color:var(--gold2)">${s.n} <span style="color:var(--text2);font-size:10px">${s.m}PM</span></span>`:'';
          }).join('')}
        </div>
        <div style="font-size:11px;color:var(--text2);margin-top:6px">
          Limite de Calor: ${Math.max(3,3+Math.floor((state.attrs.con-10)/2))} (3 + CON)
        </div>
      </div>`:''}
      <div class="btn-group" style="flex-wrap:wrap">
         <button class="btn btn-secondary" onclick="go(8)" style="flex:1;min-width:80px">← Convicções</button>
        <button class="btn btn-primary" onclick="window.print()" style="flex:1;min-width:80px">🖨️ PDF</button>
        <button class="btn btn-secondary" onclick="exportCharacter()" style="flex:1;min-width:80px">💾 Exportar</button>
        <button class="btn btn-secondary" onclick="importCharacter()" style="flex:1;min-width:80px">📂 Importar</button>
        <button class="btn btn-secondary" onclick="resetAll()" style="flex:1;min-width:80px">🔄 Novo</button>
      </div>
      ${state.convModal?convModal():''}`;
  }
];

// ===== RANDOM GENERATOR =====
const NAMES = [
  'Aelar','Bianca','Caelum','Dante','Elara','Finn','Gwyn','Halia','Ignis','Juno',
  'Kael','Lyra','Mira','Nox','Ori','Pietra','Quinn','Riven','Sera','Talus',
  'Uma','Valen','Wren','Xara','Yuki','Zephyr','Aldric','Breeze','Coral','Dusk',
  'Echo','Flint','Gale','Haven','Ivy','Jade','Kai','Lark','Moss','Nyx',
  'Onyx','Pike','Rain','Sol','Tide','Vale','Wisp','Zara','Aria','Bard',
  'Cinder','Dove','Ember','Frost','Glimmer','Hollow','Iris','Jasper','Kestrel','Luna',
  'Meridian','Nimbus','Orion','Petal','Raven','Shade','Tempest','Umbra','Vesper','Wolf',
];

function generateCharacter(){
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  const name = pick(NAMES);
  const realmId = pick(REALMS).id;
  const archId = pick(ARCHETYPES).id;
  const raceId = pick(RACES).id;
  const preset = ATTR_PRESETS[archId];
  
  // Pick random convictions and temptations
  const cKeys=Object.keys(CONVICTIONS);
  const tKeys=Object.keys(CORRUPTIONS);
  const shuffledC = [...cKeys].sort(()=>Math.random()-.5);
  const shuffledT = [...tKeys].sort(()=>Math.random()-.5);
  
  const raceObj=RACES.find(r=>r.id==raceId);
  const pickSpec=racePickSpec(raceObj&&raceObj.stats);
  let racePicks=[];
  if(pickSpec){
    const order=['for','des','con','int','sab','car'].sort(()=>Math.random()-.5);
    racePicks=order.slice(0,pickSpec.pick);
  }
  const isChaos=!!(REALMS.find(r=>r.id==realmId)?.group==='caos');

  state = {
     step: 9,
    name,level:3,
    realm: realmId,
    archetype: archId,
    race: raceId,
    attrs: {...preset},
    convic: shuffledC.slice(0,isChaos?2:3),
    tempt: shuffledT.slice(0,isChaos?3:2),
     spells: {cantrip:[],leveled:[]},

    loreRealm: null,
    convModal: null,
    saberRace: null,pathOpen:false,
    racePicks,
    chaosApplied:isChaos,
    skills:[],convMore:[],
  };

  const skCap=skillCapFor(archId,raceId);
  state.skills=[...suggestedFor(archId,raceId,realmId)].sort(()=>Math.random()-.5).slice(0,skCap);

  render();
}

function parseRacialBonuses(stats){
  const bonuses={for:0,des:0,con:0,int:0,sab:0,car:0};
  if(!stats)return bonuses;
  const s=stats.toLowerCase();
  const patterns=[
    {attr:'for',re:/([+-]\d+)\s*(for|força|str)/i},
    {attr:'des',re:/([+-]\d+)\s*(des|destreza|dex)/i},
    {attr:'con',re:/([+-]\d+)\s*(con|constituição|constituicao|con)/i},
    {attr:'int',re:/([+-]\d+)\s*(int|inteligência|inteligencia|int)/i},
    {attr:'sab',re:/([+-]\d+)\s*(sab|sabedoria|wis)/i},
    {attr:'car',re:/([+-]\d+)\s*(car|carisma|cha)/i},
  ];
  patterns.forEach(p=>{
    const m=s.match(p.re);
    if(m)bonuses[p.attr]=parseInt(m[1]);
  });
  return bonuses;
}

function racePickSpec(stats){
  if(!stats)return null;
  const s=stats.toLowerCase();
  if(s.includes('em três')||s.includes('três'))return {pick:3,pickVal:1};
  if(s.includes('em dois'))return {pick:2,pickVal:1};
  if(s.includes('sua escolha'))return {pick:1,pickVal:2};
  return null;
}
function racialEffective(race,picks){
  const b=parseRacialBonuses(race&&race.stats);
  const spec=racePickSpec(race&&race.stats);
  if(spec){
    (picks||[]).slice(0,spec.pick).forEach(k=>{b[k]=(b[k]||0)+spec.pickVal;});
  }
  return b;
}
function defaultRacePicks(race){
  const spec=racePickSpec(race&&race.stats);
  if(!spec)return [];
  const order=['for','des','con','int','sab','car'];
  return order.slice(0,spec.pick);
}
function toggleRacePick(k){
  const race=RACES.find(r=>r.id==state.race);
  const spec=racePickSpec(race&&race.stats);
  if(!spec)return;
  const arr=[...(state.racePicks||[])];
  const i=arr.indexOf(k);
  if(i>=0)arr.splice(i,1);
  else if(arr.length<spec.pick)arr.push(k);
  state.racePicks=arr;
  render();
}

function nextName(){

function adjAttr(k,delta){
  if(state.attrMode=='preset')state.attrMode='manual';
  const v=state.attrs[k]+delta;
  if(v<8||v>15)return;
  const oldCost=ATTR_COST[state.attrs[k]];
  const newCost=ATTR_COST[v];
  if(delta>0){
    const spent=Object.entries(state.attrs).reduce((s,[key,val])=>s+ATTR_COST[val],0);
    if(spent+newCost-oldCost>27)return;
  }
  state.attrs[k]=v;
  render();
}

function toggle(type,name,limit){
  const arr=state[type];
  const idx=arr.indexOf(name);
  if(idx>=0)arr.splice(idx,1);
  else if(arr.length<limit)arr.push(name);
  render();
}
function toggleConvInfo(key){
  state.convMore=state.convMore.includes(key)?state.convMore.filter(x=>x!==key):[...state.convMore,key];
  render();

function getSpellById(id){
  return ALL_SPELLS.find(s=>s.id===id)||null;
}

function getSpellsKnown(archId,level){
  const maxCircle=Math.min(
    {arcanista:9,creator:7,vigilante:5,baluarte:4,guerreiro:3}[archId]||3,
    Math.floor((level+1)/2)+1
  );
  const cantripLimit={arcanista:3,creator:2,vigilante:2,baluarte:2,guerreiro:1}[archId]||1;
  const totalKnown={
    arcanista:Math.min(2+level*2,40),
    creator:Math.min(1+level,22),
    vigilante:Math.min(1+Math.floor(level/2),12),
    baluarte:Math.min(1+Math.floor(level/2),13),
    guerreiro:0
  }[archId]||0;
  const result={cantrip:cantripLimit};
  let rem=totalKnown;
  for(let c=1;c<=maxCircle&&rem>0;c++){
    const take=Math.min(Math.ceil(rem/(maxCircle-c+1)),4);
    result[''+c]=take;
    rem-=take;
  }
  return result;
}

function isCantripSpell(id){
  const s=ALL_SPELLS.find(s=>s.id===id);
  return s?s.c===0:false;
}

function toggleSpell(id){
  const isCantrip=isCantripSpell(id);
  const sk=getSpellsKnown(state.archetype,state.level||3);
  const arr=isCantrip?state.spells.cantrip:state.spells.leveled;
  const limit=isCantrip?sk.cantrip:Object.entries(sk).filter(([k])=>k!='cantrip').reduce((a,[,v])=>a+v,0);
  const idx=arr.indexOf(id);
  if(idx>=0)arr.splice(idx,1);
  else if(arr.length<limit)arr.push(id);
  render();
}

function exportCharacter(){
  const json=JSON.stringify(state,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(state.name||'personagem')+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importCharacter(){
  const input=document.createElement('input');
  input.type='file';
  input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        state=data;
        render();
      }catch(err){
        alert('Erro ao importar: arquivo inválido.');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetAll(){
  state={step:0,name:'',level:3,realm:null,archetype:null,race:null,attrs:{},convic:[],tempt:[],spells:{cantrip:[],leveled:[]},equipment:{weapons:[],armor:'sem-armadura',shield:false},attrMode:'preset',loreRealm:null,convModal:null,spellModal:null,saberRace:null,pathOpen:false,skills:[],convMore:[],racePicks:[],chaosApplied:false};
  render();
}

document.addEventListener('keydown',e=>{if(e.key=='Enter'&&state.step==1)nextName()});

render();
