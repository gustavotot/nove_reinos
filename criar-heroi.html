<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Os 9 Reinos — Criação de Personagem</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500;600;700&display=swap');

:root{
  --bg:#0a0a0a;
  --bg2:#111111;
  --bg3:#1a1a1a;
  --bg4:#222222;
  --gold:#d4a843;
  --gold2:#f0d080;
  --gold-dim:#8a7a40;
  --text:#e8e0d0;
  --text2:#888080;
  --red:#cc4444;
  --radius:10px;
  --serif:'Cormorant Garamond',serif;
}

body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100dvh}
h1,h2,h3{font-family:'Cinzel',serif;font-weight:700}

#embers{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
 #stepHeader{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--bg4)}
 #steps{display:flex;justify-content:flex-start;align-items:center;gap:8px;padding:14px 12px 0 104px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 #steps::-webkit-scrollbar{display:none}
 #stepLabel{text-align:center;font-size:11px;color:var(--gold-dim);letter-spacing:.1em;text-transform:uppercase;padding:6px 0 12px;font-weight:600}
.chronicle-link{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);text-decoration:none;letter-spacing:.03em;transition:.2s;white-space:nowrap}
.chronicle-link:hover{color:var(--gold)}
 .step-dot{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;font-family:inherit;background:var(--bg3);color:var(--text2);border:2px solid transparent;transition:.3s;cursor:pointer;box-sizing:border-box}
.step-dot.active{border-color:var(--gold);color:var(--gold);background:var(--bg2)}
 .step-dot.done{background:var(--gold);color:var(--bg);border-color:var(--gold)}
 .step-dot:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 3px 12px rgba(212,168,67,.3)}
 .step-dot:disabled{cursor:not-allowed;opacity:.32}
 .step-dot .dot-label{display:none}
 @media(min-width:700px){#steps{gap:8px}.step-dot{width:auto;height:auto;border-radius:20px;padding:9px 16px}.step-dot .dot-label{display:inline;font-size:12.5px;margin-left:8px}#stepLabel{display:none}}

.screen{display:none;padding:16px 18px 24px;max-width:480px;margin:0 auto;animation:fadeIn .35s cubic-bezier(.2,.7,.2,1);position:relative;z-index:1}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media print{#steps,#embers,.chronicle-link,.btn-group,.btn,.more-btn,.info-btn{display:none!important}.screen{padding:0!important;max-width:100%!important}.result-card{border:1px solid var(--bg4)!important;break-inside:avoid}.stat-card{border:1px solid var(--bg4)!important}.tag{border:1px solid var(--bg4)!important}}

.card-grid{display:grid;gap:10px;margin-top:12px}
.card-grid.c3{grid-template-columns:repeat(3,1fr)}
.card-grid.c2{grid-template-columns:repeat(2,1fr)}
.spell-tab{background:var(--bg3);border:1px solid var(--bg4);color:var(--text2);padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;transition:.2s}
.spell-tab:hover{border-color:var(--gold-dim);color:var(--gold2)}
.spell-tab.active{background:var(--bg4);border-color:var(--gold);color:var(--gold)}
.card{background:var(--bg3);border-radius:var(--radius);padding:12px;border:2px solid transparent;cursor:pointer;transition:.25s;text-align:center;position:relative;overflow:hidden}
.card:hover{border-color:var(--gold-dim);background:var(--bg2);transform:translateY(-2px)}
.card.selected{border-color:var(--gold);background:var(--bg2);box-shadow:0 0 20px rgba(212,168,67,.15)}
.card[style*="--k"]:hover{border-color:color-mix(in srgb,var(--k) 55%,var(--gold-dim))}
.card[style*="--k"].selected{border-color:var(--k);box-shadow:0 0 22px color-mix(in srgb,var(--k) 35%,transparent)}
.card .icon{font-size:28px;margin-bottom:4px}.card .name{font-weight:600;font-size:14px;color:var(--text)}
.card .sub{font-size:11px;color:var(--text2);margin-top:2px}
.card .virtude-tag{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--k,var(--gold-dim));margin-top:3px;font-family:'Inter',sans-serif}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
.modal-content{background:var(--bg2);border-radius:var(--radius);padding:24px;max-width:440px;width:100%;max-height:80vh;overflow-y:auto;border:1px solid var(--gold-dim)}
.conv-card{background:var(--bg3);border-radius:var(--radius);padding:12px;border:2px solid var(--bg4);cursor:pointer;transition:.25s}
.conv-card:hover{border-color:var(--gold-dim)}
.conv-card.selected{border-color:var(--gold);background:var(--bg2)}
.conv-card.selected.corrupt{border-color:var(--red);background:var(--bg2);box-shadow:0 0 16px rgba(204,68,68,.15)}
.btn{padding:11px 28px;border-radius:50px;font-weight:600;font-size:14px;border:1px solid transparent;cursor:pointer;transition:.25s;display:inline-flex;align-items:center;justify-content:center;letter-spacing:.5px}
.btn-primary{background:var(--gold);color:var(--bg)}
.btn-primary:hover{background:var(--gold2);transform:translateY(-2px)}
.btn-secondary{background:transparent;color:var(--text);border-color:var(--text2)}
.btn-secondary:hover{background:var(--bg3)}
.btn-group{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
.btn-group .btn{flex:1}

.attr-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.attr-label{width:44px;font-weight:600;font-size:13px;color:var(--gold);flex-shrink:0}
.attr-bar{flex:1;height:22px;background:var(--bg3);border-radius:11px;overflow:hidden}
.attr-fill{height:100%;border-radius:11px;transition:.3s;background:linear-gradient(90deg,var(--gold-dim),var(--gold))}
.attr-val{width:48px;text-align:center;font-weight:700;font-size:18px;color:var(--text);line-height:1.1;flex-shrink:0}
.attr-val .racial-badge{display:block;font-size:9px;color:#66dd66;font-weight:600;margin-top:2px;white-space:nowrap}
.attr-mod{width:42px;text-align:center;flex-shrink:0;line-height:1.1}
.attr-mod .mod-num{display:block;font-weight:700;font-size:16px;color:var(--text)}
.attr-mod .mod-sub{display:block;font-size:8.5px;font-weight:500;color:var(--text2);margin-top:1px;white-space:nowrap}
.attr-mod.pos .mod-num{color:#66dd66}
.attr-mod.neg .mod-num{color:#dd6666}
.attr-btns{display:flex;gap:3px}
.attr-btns button{width:26px;height:26px;border-radius:50%;border:1px solid var(--text2);background:var(--bg3);color:var(--text);font-size:16px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
.attr-btns button:hover{background:var(--bg4);border-color:var(--gold)}
.attr-btns button:disabled{opacity:.25;cursor:not-allowed}
.racial-box{background:var(--bg3);border:1px solid var(--bg4);border-radius:10px;padding:10px 12px;font-size:11px;color:var(--gold2);margin-bottom:10px}
.racial-box .rb-title{font-weight:600;color:var(--gold);margin-bottom:6px;font-size:11px}
.racial-box .rb-sub{color:var(--text2);margin:5px 0 0;font-size:10px}
.racial-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.racial-chip{display:inline-flex;align-items:center;gap:2px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--bg4);color:var(--text2);background:var(--bg2);transition:.2s}
.racial-chip:hover{border-color:var(--gold2);color:var(--gold2)}
.racial-chip.on{background:#66dd6622;border-color:#66dd66;color:#66dd66}
.racial-chip.off{opacity:.6}
.racial-chip:disabled{cursor:not-allowed;opacity:.35}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.stat-card{background:var(--bg3);border-radius:var(--radius);padding:14px;text-align:center;border:1px solid var(--bg4)}
.stat-card .stat-val{font-size:24px;font-weight:700;color:var(--gold)}
.stat-card .stat-label{font-size:11px;color:var(--text2);margin-top:2px}

.result-card{background:var(--bg2);border-radius:var(--radius);padding:16px;margin-bottom:10px;border:1px solid var(--bg4)}
.result-card h3{font-size:15px;color:var(--gold);margin-bottom:8px}
.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;font-size:13px}
.result-grid .label{color:var(--text2)}.result-grid .val{font-weight:600;text-align:right}

.points{text-align:center;font-size:16px;font-weight:600;color:var(--gold);margin-bottom:12px}
.title{text-align:center;margin-bottom:10px}
.title h1{font-size:26px;color:var(--gold)}
.title h2{font-size:20px;color:var(--gold)}
.title p{color:var(--text2);font-size:13px}
.fruit-icon{width:70px;height:70px;margin:16px auto;background:radial-gradient(circle at 30% 30%,var(--gold2),var(--gold));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 0 40px rgba(212,168,67,.2)}
.input-name{width:100%;background:transparent;border:none;border-bottom:2px solid var(--text2);padding:10px 0;color:var(--text);font-size:20px;font-family:'Cinzel',serif;text-align:center;outline:none;transition:.3s}
.input-name:focus{border-color:var(--gold)}
.helper{color:var(--text2);font-size:12px;text-align:center;margin-top:4px}

.preset-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.preset-btn{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;background:var(--bg3);color:var(--text2);border:1px solid var(--bg4);cursor:pointer;transition:.2s}
.preset-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.preset-btn:hover{background:var(--bg4)}

.flex-tags{display:flex;flex-wrap:wrap;gap:4px}
.flex-tags .tag{padding:4px 10px;border-radius:16px;font-size:11px;cursor:pointer;border:1px solid var(--bg4);background:var(--bg3);transition:.2s;color:var(--text)}
.flex-tags .tag.selected{border-color:var(--gold);background:var(--bg2)}
.flex-tags .tag.limit{border-color:var(--red);color:var(--red)}
.flex-tags .tag.limit.selected{border-color:var(--red);background:rgba(204,68,68,.15)}

.arch-hint{font-size:11px;color:var(--gold-dim);margin-top:4px;font-style:italic}
.info-btn:hover{background:var(--gold)!important;color:var(--bg)!important}

.realm-quote{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--gold2);line-height:1.5}

@media (prefers-reduced-motion:reduce){
  .screen{animation:none}
  .card,.card:hover{transition:none;transform:none}
}

.realm-card{cursor:pointer}
.realm-card:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
</style>
</head>
<body>

<canvas id="embers"></canvas>
<div id="stepHeader">
  <a class="chronicle-link" href="index.html">📖 A Crônica</a>
  <div id="steps"></div><div id="stepLabel"></div>
</div>
<div id="app"></div>
<input id="importFileInput" type="file" accept=".json,application/json" style="display:none" onchange="handleImportFile(event)">

<script src="spells-data.js"></script>
<script src="equipment_data.js"></script>
<script>
// ===== DATA =====
const REALMS = [
  {id:'havendor',name:'Havendor',icon:'⚜️',attr:'Sabedoria',virtude:'Amor',cor:'#e0876d',
   phrase:'"Onde a luz encontra a coragem."',
   culture:'Uma civilização de cavaleiros e construtores que acredita na proteção dos fracos. Suas cidades flutuam sobre as nuvens, sustentadas por uma energia radiante que poucos compreendem.',
   lore:'Dizem que o primeiro fragmento caiu aqui, incrustando-se no coração da montanha mais alta. Os havendorianos não adoram o fragmento — eles o estudam, pois acreditam que compreendê-lo é compreender a si mesmos. Sua sociedade é estratificada em ordens: os Portadores da Aurora (cavaleiros), os Forjadores de Luz (artesãos) e os Sussurradores (estudiosos).'},
  {id:'aurivelle',name:'Aurivelle',icon:'🎭',attr:'Carisma',virtude:'Alegria',cor:'#f0c34a',
   phrase:'"A vida é uma canção que nunca termina."',
   culture:'Artistas, músicos e performers. Aqui a expressão é tudo — cada pessoa encontra seu próprio ritmo. As cidades são construídas em florestas vivas, com madeira encantada que reage à música.',
   lore:'O fragmento de Aurivelle caiu em uma clareira onde, dizem, os pássaros cantavam em uníssono. Desde então, a floresta ao redor absorveu essa harmonia. Os aurivellianos não constroem com pedra — usam madeira viva que cresce conforme a música que tocam. Cada pessoa tem uma "melodia pessoal" que reflete sua alma.'},
  {id:'selah',name:'Sélah',icon:'🌄',attr:'Sabedoria',virtude:'Paz',cor:'#a9d3df',
   phrase:'"No silêncio, encontra-se a resposta."',
   culture:'Monges, meditadores e eremitas. Uma cultura de introspecção e equilíbrio. Não buscam poder — buscam compreensão. Sua arquitetura é minimalista, esculpida nas montanhas.',
   lore:'O fragmento de Sélah não brilha — ele pulsa, como uma respiração. Os selahitas acreditam que o mundo foi criado em ciclos, e que cada pessoa pode aprender a fluir com eles. Seus mosteiros nas montanhas são centros de estudo do "Fluxo da Criação", uma energia que conecta todas as coisas.'},
  {id:'knathi',name:"K'Nahti",icon:'🌿',attr:'Inteligência',virtude:'Paciência',cor:'#7ba869',
   phrase:'"Tudo floresce no tempo certo."',
   culture:'Uma cultura arbórea e lenta. Grandes árvores-cidades abrigam gerações. Os K\'Nahti não têm pressa — acreditam que apressar é quebrar. Usam uma tinta viva extraída de plantas para criar arte, armas e aliados.',
   lore:'O fragmento de K\'Nahti caiu sobre a maior árvore do mundo, Ydrosyl, e enraizou-se nela. Os K\'Nahti desenvolveram uma relação simbiótica com a árvore — sua seiva é a "Tinta Viva" que usam para criar. Cada K\'Nahti nasce com uma cor de tinta única, que define seu estilo de criar.'},
  {id:'lumivior',name:'Lumivior',icon:'⚙️',attr:'Inteligência',virtude:'Amabilidade',cor:'#63d9c4',
   phrase:'"A tecnologia é a chave para a alma."',
   culture:'Engenheiros e inventores. Uma sociedade nômade que viaja em cidades-máquina. Não separam vida de máquina — para eles, o éter que move seus motores é a mesma energia que move o corpo.',
   lore:'O fragmento de Lumivior foi encontrado por um mecânico que tentava criar um motor perpétuo. Quando tocou o fragmento, sua máquina ganhou vida. Desde então, os lumivorianos fundiram tecnologia e éter em uma única filosofia: "Energia Vital". Suas cidades são gigantescos mecanismos ambulantes.'},
  {id:'neruviah',name:'Neruviah',icon:'🌊',attr:'Carisma',virtude:'Bondade',cor:'#3f93a8',
   phrase:'"As marés mudam, e nós mudamos com elas."',
   culture:'Nômades do mar e do deserto. Adaptam-se a qualquer ambiente seguindo os ciclos da natureza. Sua sociedade é fluida — não têm cidades fixas, apenas caravanas e navios.',
   lore:'O fragmento de Neruviah caiu no oceano e foi encontrado por uma tribo nômade que seguia as baleias. Desde então, eles aprenderam a "sentir" as marés da alma — estados de espírito que trazem diferentes bênçãos. Um neruviano pode mudar sua disposição conforme a situação, como o mar muda suas ondas.'},
  {id:'ringendah',name:'Ringendah',icon:'💍',attr:'Inteligência',virtude:'Fidelidade',cor:'#a374d1',
   phrase:'"Toda aliança é um portal."',
   culture:'Uma cultura de estudiosos e invocadores. Constroem portais entre lugares distantes usando anéis como chaves. Sua cidade principal, Serafur, é um entrecruzamento de círculos mágicos.',
   lore:'O fragmento de Ringendah partiu-se em três anéis antes de cair. Cada anél foi encontrado por um estudioso diferente, e eles discordam sobre como usá-los. Até hoje, os três anéis são mantidos separados, e cada escola de pensamento em Ringendah segue um deles.'},
  {id:'argolis',name:'Argolis',icon:'🌙',attr:'Sabedoria',virtude:'Mansidão',cor:'#7c86ba',
   phrase:'"Sob as duas luas, a verdade se revela."',
   culture:'Uma sociedade de estrategistas e observadores. Argolis tem duas luas no céu, e seus habitantes desenvolveram uma percepção aguçada do tempo e do espaço. São conhecidos como os melhores analistas táticos do mundo.',
   lore:'O fragmento de Argolis caiu em um deserto de cristal que reflete a luz das duas luas infinitamente. Os argolianos aprenderam a ler padrões em tudo — no movimento das estrelas, nas ondas do deserto, nos passos de um inimigo. Sua "Disciplina Marcial" é lendária.'},
  {id:'sphalidor',name:'Sphalidor',icon:'💎',attr:'Constituição',virtude:'Domínio Próprio',cor:'#c987ab',
   phrase:'"O som certo quebra qualquer montanha."',
   culture:'Mineiros e artesãos de cristal. Descobriram que tudo vibra em uma frequência específica. Usam a "Ressonância" para extrair minérios, construir armas e até curar. Suas cavernas-cidades são obras de arte acústica.',
   lore:'O fragmento de Sphalidor foi encontrado nas profundezas de uma caverna, incrustado em um cristal que cantava. Os sphalorianos desenvolveram a "Ressonância" — a arte de vibrar objetos e seres em sua frequência ideal. Um guerreiro sphaloriano pode fazer uma armadura vibrar para torná-la mais resistente, ou uma espada vibrar para cortar melhor.'},
  {id:'valdar',name:'Valdar',icon:'🔥',attr:'Força',virtude:'Ira',cor:'#c0392b',group:'caos',
   phrase:'"Não esconda quem você é. Liberte seus sentimentos e transforme-os em poder."',
   culture:'Um domínio de cinzas e brasas governado pelo Conclave das Cinzas. Os valdarianos acreditam que reprimir emoções é fraqueza: raiva, dor e ressentimento são fontes legítimas de força, e os conflitos se resolvem em arenas, duelos rituais e terras devastadas para extrair a verdade do caos.',
   lore:'O Cristal Carmesim é um fragmento primordial corrompido que amplifica emoções intensas e as converte em força sobrenatural. Seu primeiro guardião, o Primeiro Corrompido, foi um herói que queria apenas fazer justiça — cada vitória alimentou sua fúria até ele se tornar o Senhor da Ira. Dizem que ele ainda governa, oculto entre as cinzas do Conclave.'},
  {id:'sataris',name:'Sataris',icon:'🎭',attr:'Carisma',virtude:'Inveja',cor:'#8e7cc3',group:'caos',
   phrase:'"Por que permanecer sendo você, quando pode se tornar alguém superior?"',
   culture:'A Terra dos Ocultos — o Domínio dos Segredos. Espionagem, manipulação e substituição são as armas de Sataris, que domina pelas sombras: induzir reis ao erro, destruir alianças e fazer impérios ruírem de dentro para fora.',
   lore:'Antigas relíquias conhecidas como Faces Ancestrais — máscaras vivas com poderes, memórias e vontade de antigos portadores — definem a identidade de quem as carrega. O domínio é governado pelo Conselho das Máscaras, cujos membros nunca revelam seus verdadeiros nomes. Seu lema: "O rosto é a primeira mentira."'},
  {id:'morvath',name:'Morvath',icon:'🩸',attr:'Constituição',virtude:'Gula',cor:'#7d2b3c',group:'caos',
   phrase:'"Tudo o que existe foi feito para ser consumido."',
   culture:'O Domínio da Fome Eterna, governado por antigas Casas Nobres Noctari que disputam influência há séculos. Cada Casa tem sua tradição de alimento — sangue, essência vital, magia, emoções ou anos de vida — e todas obedecem à mesma lei: quanto mais se alimentam, maior a fome.',
   lore:'Ao buscar a imortalidade, muitos aceitaram o pacto do Cristal da Fome Eterna: pararam de envelhecer, mas passaram a depender da energia dos vivos. Nasceram os Noctari, os vampiros deste mundo. Entre banquetes e alianças, a política das Grandes Casas é uma guerra silenciosa que pode atravessar séculos.'},
  {id:'mavaron',name:'Mavaron',icon:'💰',attr:'Inteligência',virtude:'Ganância',cor:'#96711e',group:'caos',
   phrase:'"Tudo tem um preço. O verdadeiro poder pertence àquele que está disposto a pagá-lo."',
   culture:'Uma civilização construída sobre pactos, barganhas e sacrifícios ao redor do Cristal das Mil Trocas. Seus habitantes acumulam riquezas, magia, favores, títulos e até almas — para eles, possuir é vencer. Todos os Pelned trocaram a carne pela eternidade.',
   lore:'O Cristal das Mil Trocas nunca concede nada de graça; ele apenas pergunta: "Quanto isso vale para você?". Reis ofereceram reinos, outros ofereceram a própria carne ou a própria vida — e o Cristal sempre cumpriu sua parte. Em Mavaron, nenhum valor é absoluto: tudo depende do preço que alguém paga.'},
  {id:'taevora',name:'Taevora',icon:'🌹',attr:'Carisma',virtude:'Luxúria',cor:'#d95a8e',group:'caos',
   phrase:'"Aquilo que você deseja pode ser seu."',
   culture:'Uma Floresta Paradisíaca gigantesca e bela — árvores enormes, flores luminosas, frutas exóticas, rios cristalinos e néctares mágicos. Taevora não parece maligna: parece um paraíso. E seu maior perigo é o convite: "Fique mais um pouco."',
   lore:'A Floresta Viva reage a cada visitante: produz frutos dos seus desejos, cria caminhos, oferece visões e intensifica conforto. Nunca obriga ninguém a ficar — apenas oferece exatamente aquilo que não se consegue recusar. Cada desejo satisfeito gera outro, e de Taevora nascem também os maiores venenos, poções e elixires do mundo.'},
  {id:'morpheia',name:'Morpheia',icon:'🌙',attr:'Sabedoria',virtude:'Preguiça',cor:'#6d7ab0',group:'caos',
   phrase:'"Por que lutar contra a realidade, se você pode simplesmente sonhar com algo melhor?"',

function attrMod(v){return Math.floor((v-10)/2)}

// Calcula os limites de magias do personagem no nível atual
function getSpellLimits(){
  const archId=state.archetype, nv=state.nivel||1;
  const row=SPELL_PROGRESSION[archId]?.[nv];
  const a=state.attrs||{};
  if(!row)return {truques:0,limite:0,circMax:0,limiteLabel:'Conhecidas'};
  if(archId=='arcanista'){
    const [truques,lista,circMax]=row;
    const prepara=Math.max(1,nv+attrMod(a.int||10));
    return {truques,limite:lista,circMax,limiteLabel:'No Grimório',extraLabel:'Prepara por dia',extraValue:prepara};
  }
  if(archId=='creator'){
    const [truques,conhecidas,circMax]=row;
    return {truques,limite:conhecidas,circMax,limiteLabel:'Conhecidas'};
  }
  if(archId=='baluarte'){
    const [truques,circMax]=row;
    const prepara=Math.max(1,nv+attrMod(a.car||10));
    return {truques,limite:prepara,circMax,limiteLabel:'Preparadas hoje',note:'O Baluarte, em teoria, conhece todas as magias do seu reino — aqui você escolhe quais estão preparadas hoje.'};
  }
  if(archId=='vigilante'){
    const [truques,circMax]=row;
    const conhece=Math.max(1,Math.min(8,Math.floor(nv/2)+attrMod(a.sab||10)));
    return {truques,limite:conhece,circMax,limiteLabel:'Conhecidas'};
  }
  if(archId=='guerreiro'){
    const [truques,conhecidas,circMax]=row;
    return {truques,limite:conhecidas,circMax,limiteLabel:'Conhecidas'};
  }
  return {truques:0,limite:0,circMax:0,limiteLabel:'Conhecidas'};
}

  noctari:['enganação'], pelned:['persuasão'], insectoide:['sobrevivência'],
};
const REALM_SKILLS={
  havendor:['religião'], aurivelle:['performance'], selah:['intuição'], knathi:['tatuagem'],
  lumivior:['tecnologia'], neruviah:['intuição'], ringendah:['arcanismo'], argolis:['investigação'],
  sphalidor:['conhecimento'], valdar:['atletismo'], sataris:['enganação'], morvath:['intimidação'],
  mavaron:['persuasão'], taevora:['performance'], morpheia:['intuição'], hybris:['performance'],
};
function skillCapFor(archId,raceId){
  const base=ARCH_SKILL_LIMIT[archId||'']||2;
  const extra=(raceId==='humano'?1:raceId==='meio-elfo'?2:0);
  return base+extra;
}
function suggestedFor(archId,raceId,realmId){
  const base=ARCH_SKILLS[archId]||[];
  const racial=RACE_SKILLS[raceId]||[];
  const realmS=REALM_SKILLS[realmId]||[];
  return [...new Set([...base,...racial,...realmS])];
}
function suggestedSkills(){
  return suggestedFor(state.archetype,state.race,state.realm);
}
function toggleSkill(id){
  const arch=ARCHETYPES.find(a=>a.id==state.archetype);
  const race=RACES.find(r=>r.id==state.race);
  const cap=skillCapFor(arch&&arch.id,race&&race.id);
  const arr=[...(state.skills||[])];
  const i=arr.indexOf(id);
  if(i>=0)arr.splice(i,1);
  else if(arr.length<cap)arr.push(id);
  state.skills=arr;
  render();
}
const SIMPLE_WEAPONS=['clava','adaga','grande-clava','machadinha','dardo','azagaia','maça','bordão','foice','funda','martelo-leve','lança','besta-leve','ataque-desarmado'];
const ARCH_WEAPON_PROF={
  guerreiro:{all:true},
  baluarte:{all:true},
  vigilante:{simple:true,extra:['rapieira','cimitarra','espada-curta','arco-curto','besta-mao','chicote','rede']},
  arcanista:{simple:true},
  creator:{simple:true,extra:['besta-mao','rapieira','pistola','mosquete']},
};
const ARCH_ARMOR_PROF={
  guerreiro:['leve','media','pesada','escudo'],
  baluarte:['leve','media','pesada','escudo'],
  vigilante:['leve','media','escudo'],
  arcanista:['leve'],
  creator:['leve','media','escudo'],
};
function weaponProficient(archId,w){
  const p=ARCH_WEAPON_PROF[archId||''];
  if(!p)return false;
  if(p.all)return true;
  if(p.simple&&SIMPLE_WEAPONS.includes(w.id))return true;
  return (p.extra||[]).includes(w.id);
}
function armorAllowedFor(archId){return ARCH_ARMOR_PROF[archId||'']||['leve'];}
function armorProficient(archId,armor){
  if(!armor||armor.id==='sem-armadura')return true;
  return armorAllowedFor(archId).includes(armor.type);
}

// ===== RENDER =====
function render(){
  state.equipment=state.equipment||{weapons:[],armor:'sem-armadura',shield:false};
  state.equipment.weapons=state.equipment.weapons||[];
  const s=state.step;
  const maxStep=state.maxStep||0;
  document.getElementById('steps').innerHTML=STEPS.map((st,i)=>`<button type="button" class="step-dot ${i==s?'active':i<s?'done':''}" onclick="go(${i})"><span>${i<s?'✓':i+1}</span><span class="dot-label">${st.label}</span></button>`).join('');
  document.getElementById('stepLabel').textContent=STEPS[s].label;
  document.getElementById('app').innerHTML=`<div class="screen active">${screens[s]()}</div>`;
}

function go(n){state.step=n;state.maxStep=Math.max(state.maxStep||0,n);render()}
function jumpStep(n){if(n<=(state.maxStep||0))go(n)}

      ${state.spellModal?spellModal(state.spellModal):''}

      <div class="btn-group">
        <button class="btn btn-secondary" onclick="go(5)">← Atributos</button>

      </div>`;
  },

  // 7 Equipamento
  ()=>{
  const selected=state.equipment.weapons;
  const armProfs=armorAllowedFor(state.archetype);
  const weaponCard=w=>{const ok=weaponProficient(state.archetype,w);return `<div class="card ${selected.includes(w.id)?'selected':''}" style="text-align:left;padding:10px" onclick="toggleEquipmentWeapon('${w.id}')"><div class="name" style="font-size:12px">${w.name} ${ok?`<span style="font-size:9px;color:#66dd66">✔ Prof</span>`:`<span style="font-size:9px;color:var(--red)">✘ Sem prof</span>`}</div><div class="sub">${w.damage} · ${w.type}</div></div>`;};
  const armorCard=a=>{
    const allowed=armProfs.includes(a.type)||(a.id==='sem-armadura');
    const disabled=!allowed&&state.equipment.armor!==a.id;
    return `<div class="card ${state.equipment.armor===a.id?'selected':''}${disabled?'':''}" style="display:flex;justify-content:space-between;text-align:left;padding:10px;margin-bottom:6px${disabled?';opacity:.45':''}" onclick="${disabled?'':`selectEquipmentArmor('${a.id}')`}"><span class="name" style="font-size:12px">${a.name} ${allowed?`<span style="font-size:9px;color:#66dd66">✔ Prof</span>`:`<span style="font-size:9px;color:var(--red)">✘ ${a.type}</span>`}</span><span class="sub">${a.base?a.base+' CA':'DES total'}</span></div>`;
  };
    return `<div class="title"><h2>⚔️ Equipamento</h2><p>Escolha suas armas, armadura e escudo</p></div>
      <p class="arch-hint" style="text-align:center;margin-bottom:10px">O equipamento pode receber o estilo visual do seu Reino sem alterar suas regras.</p>
      <p style="font-size:12px;color:var(--gold);font-weight:600;margin:10px 0 6px">Armas (${selected.length}/2)</p>
      <div class="card-grid c2">${WEAPONS.map(weaponCard).join('')}</div>
      <p style="font-size:12px;color:var(--gold);font-weight:600;margin:14px 0 6px">Armadura (permitidas: ${['sem armadura',...armProfs.filter(p=>p!=='escudo')].join(', ')})</p>
      ${ARMOR.map(armorCard).join('')}
      <p style="font-size:12px;color:var(--gold);font-weight:600;margin:14px 0 6px">Escudo</p>
      <div class="card ${state.equipment.shield?'selected':''}" style="display:flex;justify-content:space-between;text-align:left;padding:10px${armProfs.includes('escudo')?'':';opacity:.45'}" onclick="${armProfs.includes('escudo')?`state.equipment.shield=!state.equipment.shield;render()`:''}"><span class="name" style="font-size:12px">Escudo ${armProfs.includes('escudo')?`<span style="font-size:9px;color:#66dd66">✔ Prof</span>`:`<span style="font-size:9px;color:var(--red)">✘</span>`}</span><span class="sub">+2 CA</span></div>
      <div class="btn-group"><button class="btn btn-secondary" onclick="go(6)">← Magias</button><button class="btn btn-primary" onclick="go(8)">Perícias →</button></div>`;
  },

  // 8 Perícias
  ()=>{
    const arch=ARCHETYPES.find(a=>a.id==state.archetype);
    const race=RACES.find(r=>r.id==state.race);
    const realm=REALMS.find(r=>r.id==state.realm);
    const allSkills=[
      {id:'acrobacia',nome:'Acrobacia',attr:'DES',desc:'Equilíbrio, saltos, quedas'},
      {id:'arcanismo',nome:'Arcanismo',attr:'INT',desc:'Conhecimento mágico, identificação de magias'},
      {id:'atletismo',nome:'Atletismo',attr:'FOR',desc:'Escalar, nadar, saltar, empurrar'},
      {id:'cavalgar',nome:'Cavalgar',attr:'SAB',desc:'Montar, controlar bestas'},
      {id:'conhecimento',nome:'Conhecimento',attr:'INT',desc:'História, geografia, leis, nobres'},
      {id:'enganação',nome:'Enganação',attr:'CAR',desc:'Mentir, disfarçar, falsificar'},
      {id:'furtividade',nome:'Furtividade',attr:'DES',desc:'Mover-se sem ser visto/ouvido'},
      {id:'intimidação',nome:'Intimidação',attr:'CAR',desc:'Ameaçar, coagir, impor presença'},
      {id:'intuição',nome:'Intuição',attr:'SAB',desc:'Detectar mentiras, ler intenções'},
      {id:'investigação',nome:'Investigação',attr:'INT',desc:'Buscar pistas, analisar evidências'},
      {id:'medicina',nome:'Medicina',attr:'SAB',desc:'Estabilizar, diagnosticar, tratar venenos'},
      {id:'natureza',nome:'Natureza',attr:'SAB',desc:'Flora, fauna, clima, sobrevivência'},
      {id:'percepção',nome:'Percepção',attr:'SAB',desc:'Notar detalhes, ouvir, cheirar'},
      {id:'performance',nome:'Performance',attr:'CAR',desc:'Atuar, música, dança, oratória'},
      {id:'persuasão',nome:'Persuasão',attr:'CAR',desc:'Convencer, negociar, diplomacia'},
      {id:'religião',nome:'Religião',attr:'INT',desc:'Deuses, rituais, planos, mortos-vivos'},
      {id:'sobrevivência',nome:'Sobrevivência',attr:'SAB',desc:'Rastrear, caçar, orientar-se na natureza'},
      {id:'tatuagem',nome:'Tatuagem',attr:'INT',desc:'Símbolos mágicos, runas, glifos (K\'Nahti)'},
      {id:'tecnologia',nome:'Tecnologia',attr:'INT',desc:'Máquinas, éter, engenharia (Lumivior)'},
    ];
    const base=ARCH_SKILLS[arch&&arch.id]||[];
    const racial=RACE_SKILLS[race&&race.id]||[];
    const realmS=REALM_SKILLS[state.realm]||[];
    const combined=suggestedSkills();
    const prof=state.skills||[];
    const cap=skillCapFor(arch&&arch.id,race&&race.id);
    const profBonus=2+Math.floor((state.nivel-1)/4);
    const racialS=race?racialEffective(race,state.racePicks):{for:0,des:0,con:0,int:0,sab:0,car:0};
    return `<div class="title"><h2>🎯 Perícias</h2><p>Escolha suas perícias treinadas — bônus de proficiência (+${2+Math.floor((state.nivel-1)/4)})</p></div>
      <div style="margin-bottom:10px;background:var(--bg2);border-radius:var(--radius);padding:10px;border:1px solid var(--bg4);font-size:11px;color:var(--text2);line-height:1.5">
        <strong style="color:var(--text)">🛡️ Até <strong style="color:var(--gold)">${cap}</strong> perícias (${prof.length}/${cap} escolhidas)</strong> — limite do seu Caminho, como em D&D: ${ARCH_SKILL_LIMIT[arch&&arch.id]||2} do arquétipo${race?.id==='humano'?' + 1 humano (Versatilidade)':''}${race?.id==='meio-elfo'?' + 2 meio-elfo (Proficiência em duas)':''}.<br>
        <span style="color:var(--text)"><strong style="color:var(--gold)">Sugestões:</strong> ${arch?.icon} ${arch?.name} (${base.join(', ')}) · ${race?.icon} ${race?.name} (${racial.join(', ')||'—'}) · ${realm?.icon} ${realm?.name} (${realmS.join(', ')||'—'})</span>
      </div>
      <div class="card-grid c2" style="gap:6px">
        ${allSkills.map(s=>{
          const isSuggested=combined.includes(s.id);
          const isProf=prof.includes(s.id);
          const disabled=!isProf&&prof.length>=cap;
          const mod=Math.floor(((state.attrs[s.attr]||10)+(racialS[s.attr]||0)-10)/2);
          const total=isProf?mod+profBonus:mod;
          return `<div class="card ${isProf?'selected':''}" style="text-align:left;padding:10px${disabled?';opacity:.45;filter:grayscale(.6)':''}" onclick="toggleSkill('${s.id}')" role="button" tabindex="0" title="${isProf?'Clique para remover':disabled?'Limite atingido (máx. '+cap+')':'Clique para treinar'}">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-weight:600;font-size:12px;color:var(--gold2)">${s.nome}</span>
              ${isProf?`<span style="font-size:10px;background:var(--gold);color:#000;padding:1px 6px;border-radius:6px">P ${prof.indexOf(s.id)+1}/${cap}</span>`:''}
            </div>
            <div class="sub" style="margin-top:2px;color:var(--text)">${s.desc} (${s.attr} ${mod>=0?'+':''}${mod}${isProf?` · total ${total>=0?'+':''}${total}`:''})</div>
            ${isSuggested&&!isProf?`<div style="margin-top:3px;font-size:10px;color:var(--gold2)">✦ Sugerida para sua combinação</div>`:''}
          </div>`;
        }).join('')}
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="go(7)">← Equipamento</button>
        <button class="btn btn-primary" onclick="go(9)">Convicções →</button>
      </div>`;
  },

  // 9 Convicções e Corrupções
  ()=>{
    const cKeys=Object.keys(CONVICTIONS);
    const tKeys=Object.keys(CORRUPTIONS);
    const isChaos=!!(state.realm&&REALMS.find(r=>r.id==state.realm)?.group==='caos');
    const cLim=isChaos?2:3, tLim=isChaos?3:2;
    const convCard=(k,sel)=>{
      const more=(state.convMore||[]).includes(k);
      return `<div class="conv-card ${sel?'selected':''}" onclick="toggle('convic','${k}',${cLim})" role="button" tabindex="0">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
          <span style="font-weight:600;font-size:14px;color:var(--gold)">${k}</span>
          <button onclick="event.stopPropagation();toggleConvInfo('${k}')" style="flex-shrink:0;background:var(--bg4);border:none;color:var(--gold2);padding:3px 10px;border-radius:8px;font-size:10px;cursor:pointer">${more?'− Ocultar':'＋ Mais detalhes'}</button>
        </div>
        ${more?`<div style="margin-top:8px;border-top:1px solid var(--bg4);padding-top:8px">
          <p style="font-size:12px;color:var(--text);margin:0 0 4px;line-height:1.4">${CONVICTIONS[k].desc}</p>
          <p style="font-size:11px;color:var(--text2);font-style:italic;margin:0">Ex: ${CONVICTIONS[k].ex}</p>
        </div>`:`<p style="font-size:10px;color:var(--text2);margin-top:4px">Toque para escolher · "Mais detalhes" mostra o que significa</p>`}
        ${sel?`<div style="margin-top:6px;font-size:10px;color:var(--gold)">✓ Escolhido</div>`:''}
      </div>`;
    };
    const corrCard=(k,sel)=>{
      const more=(state.convMore||[]).includes(k);
      return `<div class="conv-card ${sel?'selected corrupt':''}" onclick="toggle('tempt','${k}',${tLim})" role="button" tabindex="0">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
          <span style="font-weight:600;font-size:14px;color:var(--red)">${k}</span>
          <button onclick="event.stopPropagation();toggleConvInfo('${k}')" style="flex-shrink:0;background:var(--bg4);border:none;color:var(--gold2);padding:3px 10px;border-radius:8px;font-size:10px;cursor:pointer">${more?'− Ocultar':'＋ Mais detalhes'}</button>
        </div>
        ${more?`<div style="margin-top:8px;border-top:1px solid var(--bg4);padding-top:8px">
          <p style="font-size:12px;color:var(--text);margin:0 0 4px;line-height:1.4">${CORRUPTIONS[k].desc}</p>
          <p style="font-size:11px;color:var(--text2);font-style:italic;margin:0">Ex: ${CORRUPTIONS[k].ex}</p>
        </div>`:`<p style="font-size:10px;color:var(--text2);margin-top:4px">Toque para escolher · "Mais detalhes" mostra o que significa</p>`}
        ${sel?`<div style="margin-top:6px;font-size:10px;color:var(--red)">✓ Escolhido</div>`:''}
      </div>`;
    };
    return `<div class="title">
      <h2>⚖️ Convicções e Corrupções</h2>
      <p>A bússola moral do personagem — escolha com liberdade</p>
    </div>
    <div style="margin-bottom:12px;background:var(--bg2);border-radius:var(--radius);padding:12px;border:1px solid var(--bg4);font-size:11px;line-height:1.6">
      <div style="font-weight:600;color:var(--gold);margin-bottom:6px">🪞 Como jogar a Bússola Moral</div>
      <p style="color:var(--text);margin:0">Convicções e corrupções são <strong>guias de roleplay</strong> — colorem o jeito do personagem e o rumo que ele tende a seguir. Nada aqui obriga: a decisão é sempre sua.</p>
      <p style="color:var(--text2);margin:6px 0 0">
        ⚖️ <strong style="color:var(--gold)">Convicção</strong> — o que você <em>quer ser</em>.<br>
        🩸 <strong style="color:var(--red)">Corrupção</strong> — o que <em>é mais fácil de ser</em>.<br>
        ➖ <strong>Neutro</strong> — quando nenhuma puxa, você escolhe livre.
      </p>
      <p style="color:var(--text2);margin:6px 0 0">Quando as duas se chocam numa decisão, <strong>decida você</strong> — faça o que faz sentido pra história. A luta entre elas é o melhor drama do personagem.</p>
    </div>
    ${isChaos?`<div style="margin-bottom:10px;background:#c0392b1a;border:1px solid #c0392b;border-radius:var(--radius);padding:8px 10px;font-size:11px;color:#ff8a7a">☠️ <strong>Domínio do Caos</strong> — a corrupção pesa mais aqui: escolha <strong>2 convicções</strong> e <strong>3 corrupções</strong>.</div>`:''}
    <div style="margin-bottom:12px">
      <p style="font-size:12px;color:var(--gold);font-weight:600;margin-bottom:8px">Convicções (escolha ${cLim})</p>
      <p style="font-size:11px;color:var(--text2);margin-bottom:10px">Valores que seu personagem defende acima de tudo.</p>
      <div class="card-grid c2" style="gap:8px;margin-top:0">
        ${cKeys.map(k=>convCard(k,state.convic.includes(k))).join('')}
      </div>
    </div>
    <div style="margin-bottom:12px">
      <p style="font-size:12px;color:var(--red);font-weight:600;margin-bottom:8px">Corrupções (escolha ${tLim})</p>
      <p style="font-size:11px;color:var(--text2);margin-bottom:10px">Fraquezas que seu personagem carrega, mesmo que tente esconder.</p>
      <div class="card-grid c2" style="gap:8px;margin-top:0">
        ${tKeys.map(k=>corrCard(k,state.tempt.includes(k))).join('')}
      </div>
    </div>
    <div class="btn-group">
         <button class="btn btn-secondary" onclick="go(8)">← Perícias</button>
         <button class="btn btn-primary" onclick="go(10)" ${state.convic.length<cLim||state.tempt.length<tLim?'disabled':''}>Ver Ficha →</button>
    </div>`;
  },

  // 10 Final Sheet
  ()=>{
    const race=RACES.find(r=>r.id==state.race);
    const realm=REALMS.find(r=>r.id==state.realm);
    const arch=ARCHETYPES.find(a=>a.id==state.archetype);
    if(!arch){
      return `<div class="title"><h2>Ficha do Personagem</h2><p>Complete as etapas anteriores (pelo menos o <strong>Caminho</strong>) para montar sua ficha.</p></div>
        <div class="btn-group"><button class="btn btn-primary" onclick="go(1)">Começar →</button></div>`;
    }
    const a=state.attrs;
    const mod=v=>Math.floor((v-10)/2);
    const intMod=mod(a.int),conMod=mod(a.con),dexMod=mod(a.des),sabMod=mod(a.sab),forMod=mod(a.for),carMod=mod(a.car);
    const nv=state.nivel||1;
    const base=arch.manaBase;
    const mana=Math.max(1,nv+intMod)*base;
    const pv=arch.pv+conMod+(nv-1)*(arch.pvavg+conMod);
    const ca=10+dexMod;
    const inic=dexMod;

    const spellsById=id=>(typeof SPELLS_DATA!=='undefined'?SPELLS_DATA:[]).find(s=>s.id===id);
    const truquesSel=(state.spells.truques||[]).map(spellsById).filter(Boolean);
    const magiasSel=(state.spells.magias||[]).map(spellsById).filter(Boolean);
    const racial=race?racialEffective(race,state.racePicks):{for:0,des:0,con:0,int:0,sab:0,car:0};
    const profBonus=2+Math.floor((state.nivel-1)/4);

    return `<div class="title"><h2>${state.name||'Herói'}</h2><p style="font-size:12px">${race?.icon} ${race?.name||'?'} · ${realm?.icon} ${realm?.name||'?'} · ${arch?.icon} ${arch?.name||'?'} · Nv ${nv}</p></div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-val">${pv}</div><div class="stat-label">PV</div></div>
        <div class="stat-card"><div class="stat-val">${mana}</div><div class="stat-label">Mana</div></div>
        <div class="stat-card"><div class="stat-val">${ca}</div><div class="stat-label">CA</div></div>

      </div>
      <div class="result-card"><h3>Atributos</h3><div class="result-grid">
        ${['for','des','con','int','sab','car'].map(k=>`<span class="label">${k.toUpperCase()}</span><span class="val">${a[k]} ${racial[k]!==0?`<span style="color:#66dd66">+${racial[k]}</span>`:''} = <strong>${a[k]+racial[k]}</strong> (${mod(a[k]+racial[k])>=0?'+':''}${mod(a[k]+racial[k])})</span>`).join('')}
      </div></div>
      <div class="result-card"><h3>Origem · Caminho · Raça</h3><div class="result-grid">
        <span class="label">Origem</span><span class="val">${realm?.icon||''} ${realm?.name||'—'}</span>
        <span class="label">Caminho</span><span class="val">${arch?.icon||''} ${arch?.name||'—'}</span>
        <span class="label">Raça</span><span class="val">${race?.icon||''} ${race?.name||'—'}</span>
      </div></div>
      ${race?`
      <div class="result-card">
        <h3>${race.icon} Raça — ${race.name}</h3>
        <p style="font-size:11px;color:var(--text2);margin-bottom:8px;line-height:1.5">${race.saber||race.desc}</p>
        <div style="font-size:11px;color:var(--gold);font-weight:600;margin-bottom:6px">Bônus Raciais</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">
          ${Object.entries(racial).filter(([,v])=>v!==0).map(([k,v])=>`<span style="background:#66dd6622;border:1px solid #66dd66;padding:3px 10px;border-radius:6px;font-size:10px;color:#66dd66">${k.toUpperCase()} ${v>0?'+':''}${v}</span>`).join('')}

        <div style="font-size:11px;color:var(--gold);font-weight:600;margin-bottom:6px">Traços</div>

        <p style="font-size:10px;color:var(--text2);margin-top:8px">${race.details}</p>
      </div>`:''}
      ${pathSheet(state.archetype,state.realm)}
      <div class="result-card"><h3>Mana</h3><div class="result-grid">
        <span class="label">Fórmula</span><span class="val">(Nv ${nv} + ${intMod>=0?'+':''}${intMod}) × ${base}</span>
        <span class="label">Total</span><span class="val">${mana}</span>
      </div></div>
      <div class="result-card">
        <h3>⚖️ Convicções</h3>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
          ${state.convic.map(c=>`<span style="background:var(--bg3);padding:4px 12px;border-radius:20px;font-size:12px;border:1px solid var(--gold-dim);color:var(--gold)">${c}</span>`).join('')}
        </div>
      </div>
      <div class="result-card">
        <h3>⚠️ Corrupções</h3>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
          ${state.tempt.map(t=>`<span style="background:var(--bg3);padding:4px 12px;border-radius:20px;font-size:12px;border:1px solid var(--red);color:var(--red)">${t}</span>`).join('')}
        </div>
      </div>
      ${(truquesSel.length||magiasSel.length)?`
      <div class="result-card">
        <h3>✨ Magias</h3>
        ${truquesSel.length?`
          <p style="font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Truques</p>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">
            ${truquesSel.map(s=>`<span class="tag" style="cursor:pointer" onclick="openSpellModal('${s.id}')">${s.nome}</span>`).join('')}
          </div>`:''}
        ${magiasSel.length?`
          <p style="font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Magias</p>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${magiasSel.map(s=>`<span class="tag" style="cursor:pointer" onclick="openSpellModal('${s.id}')">${s.nome} <span style="color:var(--gold-dim)">(${s.circulo}º)</span></span>`).join('')}
          </div>`:''}
      </div>`:''}
       <div class="result-card"><h3>⚔️ Equipamento</h3><div class="result-grid">
         <span class="label">Armadura</span><span class="val">${ARMOR.find(x=>x.id===state.equipment.armor)?.name||'Sem armadura'}</span>

         <span class="label">Armas</span><span class="val">${state.equipment.weapons.length?state.equipment.weapons.map(id=>{const w=WEAPONS.find(x=>x.id===id);if(!w)return'';const ok=weaponProficient(state.archetype,w);const ab=mod((a[w.ability]||10)+(racial[w.ability]||0))+(ok?profBonus:0);return `${w.name} ${ok?'✔ Prof':'✘ Sem prof'} · Ataque ${ab>=0?'+':''}${ab} · ${w.damage}`;}).join('; '):'Nenhuma'}</span>

function generateCharacter(){
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  const name = pick(NAMES);
  const realmId = pick(REALMS).id;
  const archId = pick(ARCHETYPES).id;
  const raceId = pick(RACES).id;
  const preset = ATTR_PRESETS[archId];
  const nivel = 1+Math.floor(Math.random()*5); // Nv 1-5, personagem inicial
  
  // Pick random convictions and temptations
  const cKeys=Object.keys(CONVICTIONS);
  const tKeys=Object.keys(CORRUPTIONS);
  const shuffledC = [...cKeys].sort(()=>Math.random()-.5);
  const shuffledT = [...tKeys].sort(()=>Math.random()-.5);
  
  const raceObj=RACES.find(r=>r.id==raceId);
  const pickSpec=racePickSpec(raceObj&&raceObj.stats);
  let racePicks=[];
  if(pickSpec){
    const order=['for','des','con','int','sab','car'].sort(()=>Math.random()-.5);
    racePicks=order.slice(0,pickSpec.pick);
  }
  const isChaos=!!(REALMS.find(r=>r.id==realmId)?.group==='caos');

  state = {
    step: 9,
    name,
    realm: realmId,
    archetype: archId,
    race: raceId,
    attrs: {...preset},
    convic: shuffledC.slice(0,isChaos?2:3),
    tempt: shuffledT.slice(0,isChaos?3:2),
    attrMode: 'preset',
    loreRealm: null,
    convModal: null,
    nivel,
    spellCircle: 0,
    spells: {truques:[], magias:[]},
    equipment: {weapons:[pick(WEAPONS).id],armor:'sem-armadura',shield:false},
    spellModal: null,
    maxStep: 9,
    skills:[],
    convMore:[],
    racePicks,
    chaosApplied:isChaos,
  };

  // sorteia magias válidas para o arquétipo/nível
  const lim=getSpellLimits();
  const all = typeof SPELLS_DATA!=='undefined'?SPELLS_DATA:[];
  const truquesPool = [...all.filter(s=>s.circulo===0)].sort(()=>Math.random()-.5);
  state.spells.truques = truquesPool.slice(0,lim.truques).map(s=>s.id);
  const magiasPool = [...all.filter(s=>s.circulo>=1&&s.circulo<=lim.circMax)].sort(()=>Math.random()-.5);
  state.spells.magias = magiasPool.slice(0,lim.limite).map(s=>s.id);

  const skCap=skillCapFor(archId,raceId);
  state.skills=[...suggestedFor(archId,raceId,realmId)].sort(()=>Math.random()-.5).slice(0,skCap);

  render();
}

function parseRacialBonuses(stats){
  const bonuses={for:0,des:0,con:0,int:0,sab:0,car:0};
  if(!stats)return bonuses;
  const s=stats.toLowerCase();
  const patterns=[
    {attr:'for',re:/([+-]\d+)\s*(for|força|str)/i},
    {attr:'des',re:/([+-]\d+)\s*(des|destreza|dex)/i},
    {attr:'con',re:/([+-]\d+)\s*(con|constituição|constituicao|con)/i},
    {attr:'int',re:/([+-]\d+)\s*(int|inteligência|inteligencia|int)/i},
    {attr:'sab',re:/([+-]\d+)\s*(sab|sabedoria|wis)/i},
    {attr:'car',re:/([+-]\d+)\s*(car|carisma|cha)/i},
  ];
  patterns.forEach(p=>{
    const m=s.match(p.re);
    if(m)bonuses[p.attr]=parseInt(m[1]);
  });
  return bonuses;
}

function racePickSpec(stats){
  if(!stats)return null;
  const s=stats.toLowerCase();
  if(s.includes('em três')||s.includes('três'))return {pick:3,pickVal:1};
  if(s.includes('em dois'))return {pick:2,pickVal:1};
  if(s.includes('sua escolha'))return {pick:1,pickVal:2};
  return null;
}
function racialEffective(race,picks){
  const b=parseRacialBonuses(race&&race.stats);
  const spec=racePickSpec(race&&race.stats);
  if(spec){
    (picks||[]).slice(0,spec.pick).forEach(k=>{b[k]=(b[k]||0)+spec.pickVal;});
  }
  return b;
}
function defaultRacePicks(race){
  const spec=racePickSpec(race&&race.stats);
  if(!spec)return [];
  const order=['for','des','con','int','sab','car'];
  return order.slice(0,spec.pick);
}
function toggleRacePick(k){
  const race=RACES.find(r=>r.id==state.race);
  const spec=racePickSpec(race&&race.stats);
  if(!spec)return;
  const arr=[...(state.racePicks||[])];
  const i=arr.indexOf(k);
  if(i>=0)arr.splice(i,1);
  else if(arr.length<spec.pick)arr.push(k);
  state.racePicks=arr;
  render();
}

  const v=state.attrs[k]+delta;

  const oldCost=ATTR_COST[state.attrs[k]];
  const newCost=ATTR_COST[v];
  if(delta>0){

  }
  state.attrs[k]=v;
  render();
}

function getExportData(){return {_tipo:'os9reinos-personagem',_versao:2,name:state.name,realm:state.realm,archetype:state.archetype,race:state.race,attrs:state.attrs,attrMode:state.attrMode,convic:state.convic,tempt:state.tempt,nivel:state.nivel,spells:state.spells,equipment:state.equipment};}
function exportJSON(){
  const blob=new Blob([JSON.stringify(getExportData(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=((state.name||'heroi').replace(/[^a-zA-Z0-9_-]+/g,'_')||'heroi')+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function triggerImportFile(){document.getElementById('importFileInput').click()}
function handleImportFile(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const d=JSON.parse(e.target.result);const oldSpells=d.spells||{};state={...state,...d,step:9,maxStep:9,equipment:d.equipment||{weapons:[],armor:'sem-armadura',shield:false},spells:{truques:Array.isArray(oldSpells.truques)?oldSpells.truques:(oldSpells.cantrip||[]),magias:Array.isArray(oldSpells.magias)?oldSpells.magias:(oldSpells.leveled||[])}};render()}catch(err){alert('Não foi possível ler este arquivo JSON.')}event.target.value=''};reader.readAsText(file)}

document.addEventListener('keydown',e=>{
  if(e.key=='Enter'&&state.step==1){nextName();return}
  if((e.key=='Enter'||e.key==' ')&&document.activeElement?.getAttribute('role')=='button'){
    e.preventDefault();
    document.activeElement.click();
  }
});

render();

// ===== AMBIENT EMBERS (matches the Chronicle page) =====
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const emberCanvas = document.getElementById('embers');
const ectx = emberCanvas.getContext('2d');
let EW,EH,embers=[];
function emberResize(){EW=emberCanvas.width=innerWidth;EH=emberCanvas.height=innerHeight}
addEventListener('resize',emberResize);emberResize();
function mkEmber(){return{x:Math.random()*EW,y:EH+Math.random()*120,r:Math.random()*1.4+.4,spd:Math.random()*.3+.1,drift:(Math.random()-.5)*.2,alpha:Math.random()*.4+.1,flicker:Math.random()*.02+.006,phase:Math.random()*Math.PI*2}}
const EN=reduceMotion?0:(innerWidth<700?10:20);
for(let i=0;i<EN;i++)embers.push(mkEmber());
function emberTick(){
  ectx.clearRect(0,0,EW,EH);
  embers.forEach(p=>{
    p.y-=p.spd;p.x+=p.drift;p.phase+=p.flicker;
    if(p.y<-10){Object.assign(p,mkEmber());p.y=EH+10}
    const a=p.alpha*(0.6+0.4*Math.sin(p.phase));
    ectx.beginPath();ectx.fillStyle=`rgba(212,168,67,${a})`;ectx.arc(p.x,p.y,p.r,0,Math.PI*2);ectx.fill();
  });
  if(!reduceMotion)requestAnimationFrame(emberTick);
}
emberTick();
</script>
