<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Os 9 Reinos — Criação de Personagem</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500;600;700&display=swap');

:root{
  --bg:#0a0a0a;
  --bg2:#111111;
  --bg3:#1a1a1a;
  --bg4:#222222;
  --gold:#d4a843;
  --gold2:#f0d080;
  --gold-dim:#8a7a40;
  --text:#e8e0d0;
  --text2:#888080;
  --red:#cc4444;
  --radius:10px;
  --serif:'Cormorant Garamond',serif;
}

body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100dvh}
h1,h2,h3{font-family:'Cinzel',serif;font-weight:700}

#embers{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
#steps{display:flex;justify-content:center;align-items:center;gap:6px;padding:14px 12px;position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--bg4)}
.chronicle-link{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);text-decoration:none;letter-spacing:.03em;transition:.2s;white-space:nowrap}
.chronicle-link:hover{color:var(--gold)}
.step-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:var(--bg3);color:var(--text2);border:2px solid transparent;transition:.3s;cursor:default}
.step-dot.active{border-color:var(--gold);color:var(--gold);background:var(--bg2)}
.step-dot.done{background:var(--gold);color:var(--bg);border-color:var(--gold)}

.screen{display:none;padding:16px 18px 24px;max-width:480px;margin:0 auto;animation:fadeIn .35s cubic-bezier(.2,.7,.2,1);position:relative;z-index:1}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media print{#steps,#embers,.chronicle-link,.btn-group,.btn,.more-btn,.info-btn{display:none!important}.screen{padding:0!important;max-width:100%!important}.result-card{border:1px solid var(--bg4)!important;break-inside:avoid}.stat-card{border:1px solid var(--bg4)!important}.tag{border:1px solid var(--bg4)!important}}

.card-grid{display:grid;gap:10px;margin-top:12px}
.card-grid.c3{grid-template-columns:repeat(3,1fr)}
.card-grid.c2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--bg3);border-radius:var(--radius);padding:12px;border:2px solid transparent;cursor:pointer;transition:.25s;text-align:center;position:relative;overflow:hidden}
.card:hover{border-color:var(--gold-dim);background:var(--bg2);transform:translateY(-2px)}
.card.selected{border-color:var(--gold);background:var(--bg2);box-shadow:0 0 20px rgba(212,168,67,.15)}
.card[style*="--k"]:hover{border-color:color-mix(in srgb,var(--k) 55%,var(--gold-dim))}
.card[style*="--k"].selected{border-color:var(--k);box-shadow:0 0 22px color-mix(in srgb,var(--k) 35%,transparent)}
.card .icon{font-size:28px;margin-bottom:4px}.card .name{font-weight:600;font-size:14px;color:var(--text)}
.card .sub{font-size:11px;color:var(--text2);margin-top:2px}
.card .virtude-tag{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--k,var(--gold-dim));margin-top:3px;font-family:'Inter',sans-serif}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
.modal-content{background:var(--bg2);border-radius:var(--radius);padding:24px;max-width:440px;width:100%;max-height:80vh;overflow-y:auto;border:1px solid var(--gold-dim)}
.conv-card{background:var(--bg3);border-radius:var(--radius);padding:12px;border:2px solid var(--bg4);cursor:pointer;transition:.25s;margin-bottom:8px}
.conv-card:hover{border-color:var(--gold-dim)}
.conv-card.selected{border-color:var(--gold);background:var(--bg2)}
.conv-card.selected.corrupt{border-color:var(--red);background:var(--bg2);box-shadow:0 0 16px rgba(204,68,68,.15)}
.btn{padding:11px 28px;border-radius:50px;font-weight:600;font-size:14px;border:1px solid transparent;cursor:pointer;transition:.25s;display:inline-flex;align-items:center;justify-content:center;letter-spacing:.5px}
.btn-primary{background:var(--gold);color:var(--bg)}
.btn-primary:hover{background:var(--gold2);transform:translateY(-2px)}
.btn-secondary{background:transparent;color:var(--text);border-color:var(--text2)}
.btn-secondary:hover{background:var(--bg3)}
.btn-group{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
.btn-group .btn{flex:1}

.attr-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.attr-label{width:44px;font-weight:600;font-size:13px;color:var(--gold)}
.attr-bar{flex:1;height:22px;background:var(--bg3);border-radius:11px;overflow:hidden}
.attr-fill{height:100%;border-radius:11px;transition:.3s;background:linear-gradient(90deg,var(--gold-dim),var(--gold))}
.attr-val{width:24px;text-align:center;font-weight:700;font-size:15px;color:var(--gold2)}
.attr-mod{width:26px;text-align:center;font-weight:700;font-size:15px}
.attr-mod.pos{color:#66dd66}
.attr-mod.neg{color:#dd6666}
.attr-btns{display:flex;gap:3px}
.attr-btns button{width:26px;height:26px;border-radius:50%;border:1px solid var(--text2);background:var(--bg3);color:var(--text);font-size:16px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
.attr-btns button:hover{background:var(--bg4);border-color:var(--gold)}
.attr-btns button:disabled{opacity:.25;cursor:not-allowed}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.stat-card{background:var(--bg3);border-radius:var(--radius);padding:14px;text-align:center;border:1px solid var(--bg4)}
.stat-card .stat-val{font-size:24px;font-weight:700;color:var(--gold)}
.stat-card .stat-label{font-size:11px;color:var(--text2);margin-top:2px}

.result-card{background:var(--bg2);border-radius:var(--radius);padding:16px;margin-bottom:10px;border:1px solid var(--bg4)}
.result-card h3{font-size:15px;color:var(--gold);margin-bottom:8px}
.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;font-size:13px}
.result-grid .label{color:var(--text2)}.result-grid .val{font-weight:600;text-align:right}

.points{text-align:center;font-size:16px;font-weight:600;color:var(--gold);margin-bottom:12px}
.title{text-align:center;margin-bottom:10px}
.title h1{font-size:26px;color:var(--gold)}
.title h2{font-size:20px;color:var(--gold)}
.title p{color:var(--text2);font-size:13px}
.fruit-icon{width:70px;height:70px;margin:16px auto;background:radial-gradient(circle at 30% 30%,var(--gold2),var(--gold));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 0 40px rgba(212,168,67,.2)}
.input-name{width:100%;background:transparent;border:none;border-bottom:2px solid var(--text2);padding:10px 0;color:var(--text);font-size:20px;font-family:'Cinzel',serif;text-align:center;outline:none;transition:.3s}
.input-name:focus{border-color:var(--gold)}
.helper{color:var(--text2);font-size:12px;text-align:center;margin-top:4px}

.preset-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.preset-btn{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;background:var(--bg3);color:var(--text2);border:1px solid var(--bg4);cursor:pointer;transition:.2s}
.preset-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.preset-btn:hover{background:var(--bg4)}

.flex-tags{display:flex;flex-wrap:wrap;gap:4px}
.flex-tags .tag{padding:4px 10px;border-radius:16px;font-size:11px;cursor:pointer;border:1px solid var(--bg4);background:var(--bg3);transition:.2s;color:var(--text)}
.flex-tags .tag.selected{border-color:var(--gold);background:var(--bg2)}
.flex-tags .tag.limit{border-color:var(--red);color:var(--red)}
.flex-tags .tag.limit.selected{border-color:var(--red);background:rgba(204,68,68,.15)}

.arch-hint{font-size:11px;color:var(--gold-dim);margin-top:4px;font-style:italic}
.info-btn:hover{background:var(--gold)!important;color:var(--bg)!important}

.realm-quote{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--gold2);line-height:1.5}

@media (prefers-reduced-motion:reduce){
  .screen{animation:none}
  .card,.card:hover{transition:none;transform:none}
}
</style>
</head>

function attrMod(v){return Math.floor((v-10)/2)}

// Calcula os limites de magias do personagem no nível atual
function getSpellLimits(){
  const archId=state.archetype, nv=state.nivel||1;
  const row=SPELL_PROGRESSION[archId]?.[nv];
  const a=state.attrs||{};
  if(!row)return {truques:0,limite:0,circMax:0,limiteLabel:'Conhecidas'};
  if(archId=='arcanista'){
    const [truques,lista,circMax]=row;
    const prepara=Math.max(1,nv+attrMod(a.int||10));
    return {truques,limite:lista,circMax,limiteLabel:'No Grimório',extraLabel:'Prepara por dia',extraValue:prepara};
  }
  if(archId=='creator'){
    const [truques,conhecidas,circMax]=row;
    return {truques,limite:conhecidas,circMax,limiteLabel:'Conhecidas'};
  }
  if(archId=='baluarte'){
    const [truques,circMax]=row;
    const prepara=Math.max(1,nv+attrMod(a.car||10));
    return {truques,limite:prepara,circMax,limiteLabel:'Preparadas hoje',note:'O Baluarte, em teoria, conhece todas as magias do seu reino — aqui você escolhe quais estão preparadas hoje.'};
  }
  if(archId=='vigilante'){
    const [truques,circMax]=row;
    const conhece=Math.max(1,Math.min(8,Math.floor(nv/2)+attrMod(a.sab||10)));
    return {truques,limite:conhece,circMax,limiteLabel:'Conhecidas'};
  }
  if(archId=='guerreiro'){
    const [truques,conhecidas,circMax]=row;
    return {truques,limite:conhecidas,circMax,limiteLabel:'Conhecidas'};
  }
  return {truques:0,limite:0,circMax:0,limiteLabel:'Conhecidas'};
}

const NAMES = [
  'Aelar','Bianca','Caelum','Dante','Elara','Finn','Gwyn','Halia','Ignis','Juno',
  'Kael','Lyra','Mira','Nox','Ori','Pietra','Quinn','Riven','Sera','Talus',
  'Uma','Valen','Wren','Xara','Yuki','Zephyr','Aldric','Breeze','Coral','Dusk',
  'Echo','Flint','Gale','Haven','Ivy','Jade','Kai','Lark','Moss','Nyx',
  'Onyx','Pike','Rain','Sol','Tide','Vale','Wisp','Zara','Aria','Bard',
  'Cinder','Dove','Ember','Frost','Glimmer','Hollow','Iris','Jasper','Kestrel','Luna',
  'Meridian','Nimbus','Orion','Petal','Raven','Shade','Tempest','Umbra','Vesper','Wolf',
];

function generateCharacter(){
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  const name = pick(NAMES);
  const realmId = pick(REALMS).id;
  const archId = pick(ARCHETYPES).id;
  const raceId = pick(RACES).id;
  const preset = ATTR_PRESETS[archId];
  const nivel = 1+Math.floor(Math.random()*5); // Nv 1-5, personagem inicial
  
  // Pick random convictions and temptations
  const cKeys=Object.keys(CONVICTIONS);
  const tKeys=Object.keys(CORRUPTIONS);
  const shuffledC = [...cKeys].sort(()=>Math.random()-.5);
  const shuffledT = [...tKeys].sort(()=>Math.random()-.5);
  
  state = {
    step: 8,
    name,
    realm: realmId,
    archetype: archId,
    race: raceId,
    attrs: {...preset},
    convic: shuffledC.slice(0,3),
    tempt: shuffledT.slice(0,2),
    attrMode: 'preset',
    loreRealm: null,
    convModal: null,
    nivel,
    spellCircle: 0,
    spells: {truques:[], magias:[]},
    spellModal: null,
  };

  // sorteia magias válidas para o arquétipo/nível
  const lim=getSpellLimits();
  const all = typeof SPELLS_DATA!=='undefined'?SPELLS_DATA:[];
  const truquesPool = [...all.filter(s=>s.circulo===0)].sort(()=>Math.random()-.5);
  state.spells.truques = truquesPool.slice(0,lim.truques).map(s=>s.id);
  const magiasPool = [...all.filter(s=>s.circulo>=1&&s.circulo<=lim.circMax)].sort(()=>Math.random()-.5);
  state.spells.magias = magiasPool.slice(0,lim.limite).map(s=>s.id);

  render();
}

function applyPreset(){
  state.attrMode='preset';
  state.attrs={...ATTR_PRESETS[state.archetype]};
  render();
}
function editManual(){
  state.attrMode='manual';
  state.attrs={for:8,des:8,con:8,int:8,sab:8,car:8};
  render();
}

function nextName(){

  else document.getElementById('nameIn')?.focus();

function adjAttr(k,delta){
  if(state.attrMode=='preset')state.attrMode='manual';
  const v=state.attrs[k]+delta;
  if(v<8||v>15)return;
  const oldCost=ATTR_COST[state.attrs[k]];
  const newCost=ATTR_COST[v];
  if(delta>0){
    const spent=Object.entries(state.attrs).reduce((s,[key,val])=>s+ATTR_COST[val],0);
    if(spent+newCost-oldCost>27)return;
  }
  state.attrs[k]=v;
  render();
}

function toggle(type,name,limit){
  const arr=state[type];
  const idx=arr.indexOf(name);
  if(idx>=0)arr.splice(idx,1);
  else if(arr.length<limit)arr.push(name);
  render();
}

function adjNivel(delta){
  const v=(state.nivel||1)+delta;
  if(v<1||v>20)return;
  state.nivel=v;
  sanitizeSpells();
  render();
}

function setSpellCircle(c){state.spellCircle=c;render()}

function toggleSpell(kind,id,capacity){
  const arr=state.spells[kind];
  const idx=arr.indexOf(id);
  if(idx>=0)arr.splice(idx,1);
  else if(arr.length<capacity)arr.push(id);
  render();
}

// Remove magias que ficaram fora do limite/círculo permitido após mudar nível ou arquétipo
function sanitizeSpells(){
  const lim=getSpellLimits();
  const spellsById=id=>(typeof SPELLS_DATA!=='undefined'?SPELLS_DATA:[]).find(s=>s.id===id);
  state.spells.truques=(state.spells.truques||[]).slice(0,lim.truques);
  state.spells.magias=(state.spells.magias||[]).filter(id=>{
    const s=spellsById(id);
    return s && s.circulo>=1 && s.circulo<=lim.circMax;
  }).slice(0,lim.limite);
}

// ===== IMPORTAR / EXPORTAR FICHA (JSON) =====
function getExportData(){
  return {
    _tipo:'os9reinos-personagem',
    _versao:1,
    name:state.name,
    realm:state.realm,
    archetype:state.archetype,
    race:state.race,
    attrs:state.attrs,
    attrMode:state.attrMode,
    convic:state.convic,
    tempt:state.tempt,
    nivel:state.nivel,
    spells:state.spells,
  };
}

function exportJSON(){
  const data=getExportData();
  const json=JSON.stringify(data,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const safeName=(state.name||'heroi').trim().replace(/[^a-zA-Z0-9\u00C0-\u00FF_-]+/g,'_')||'heroi';
  const a=document.createElement('a');
  a.href=url;
  a.download=`${safeName}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function triggerImportFile(){
  document.getElementById('importFileInput').click();
}

function handleImportFile(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      importCharacter(data);
    }catch(err){
      alert('Não foi possível ler este arquivo. Verifique se é uma ficha exportada em JSON válida.');
    }
    event.target.value='';
  };
  reader.onerror=()=>alert('Erro ao ler o arquivo.');
  reader.readAsText(file);
}

function importCharacter(data){
  if(!data||typeof data!=='object'||Array.isArray(data)){
    alert('Arquivo inválido: não contém uma ficha reconhecível.');
    return;
  }
  state={
    step:8,
    name:data.name||'',
    realm:data.realm||null,
    archetype:data.archetype||null,
    race:data.race||null,
    attrs:(data.attrs&&typeof data.attrs==='object')?{...data.attrs}:{},
    convic:Array.isArray(data.convic)?data.convic:[],
    tempt:Array.isArray(data.tempt)?data.tempt:[],
    attrMode:data.attrMode||'preset',
    loreRealm:null,
    convModal:null,
    nivel:data.nivel||1,
    spellCircle:0,
    spells:{
      truques:Array.isArray(data.spells?.truques)?data.spells.truques:[],
      magias:Array.isArray(data.spells?.magias)?data.spells.magias:[],
    },
    spellModal:null,
  };
  sanitizeSpells();
  render();
}

document.addEventListener('keydown',e=>{
  if(e.key=='Enter'&&state.step==1){nextName();return}
  if((e.key=='Enter'||e.key==' ')&&document.activeElement?.getAttribute('role')=='button'){
    e.preventDefault();
    document.activeElement.click();
  }
});

function emberResize(){EW=emberCanvas.width=innerWidth;EH=emberCanvas.height=innerHeight}
addEventListener('resize',emberResize);emberResize();
function mkEmber(){return{x:Math.random()*EW,y:EH+Math.random()*120,r:Math.random()*1.4+.4,spd:Math.random()*.3+.1,drift:(Math.random()-.5)*.2,alpha:Math.random()*.4+.1,flicker:Math.random()*.02+.006,phase:Math.random()*Math.PI*2}}
const EN=reduceMotion?0:(innerWidth<700?10:20);
for(let i=0;i<EN;i++)embers.push(mkEmber());
function emberTick(){
  ectx.clearRect(0,0,EW,EH);
  embers.forEach(p=>{
    p.y-=p.spd;p.x+=p.drift;p.phase+=p.flicker;
    if(p.y<-10){Object.assign(p,mkEmber());p.y=EH+10}
    const a=p.alpha*(0.6+0.4*Math.sin(p.phase));
    ectx.beginPath();ectx.fillStyle=`rgba(212,168,67,${a})`;ectx.arc(p.x,p.y,p.r,0,Math.PI*2);ectx.fill();
  });
  if(!reduceMotion)requestAnimationFrame(emberTick);
}
emberTick();
</script>
</body>
</html>
