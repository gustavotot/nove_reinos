<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reino — Ecos da Luz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Inter:wght@300;400;500;600;700&display=swap');
:root{--bg:#0a0a0a;--bg2:#111111;--bg3:#1a1a1a;--bg4:#232323;--gold:#d4a843;--gold2:#f0d080;--gold-dim:#8a7a40;--text:#e8e0d0;--text2:#a89a88;--text3:#6a6058;--realm:#d4a843}
html,body{height:100%;width:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.6;overflow-x:hidden}
h1,h2,h3{font-family:'Cinzel',serif;font-weight:700;letter-spacing:.03em}

/* HERO */
.hero{position:relative;min-height:62vh;display:flex;align-items:flex-end;overflow:hidden;background:linear-gradient(180deg,#141414 0%,#0a0a0a 100%)}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 30%;opacity:0;transition:opacity .8s ease}
.hero-bg.loaded{opacity:.55}
.hero-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,0) 20%,rgba(10,10,10,.65) 65%,var(--bg) 100%)}
.hero-content{position:relative;z-index:2;width:100%;max-width:1000px;margin:0 auto;padding:3rem clamp(1.2rem,4vw,2rem) clamp(2.5rem,6vw,4rem)}
.hero-ico{font-size:clamp(2.2rem,6vw,3rem);margin-bottom:.6rem;text-shadow:0 0 30px color-mix(in srgb,var(--realm) 55%,transparent)}
.hero-nome{font-size:clamp(2rem,7vw,3rem);color:var(--gold2)}
.hero-sup{display:flex;flex-wrap:wrap;gap:.5rem 1rem;margin-top:.9rem;color:var(--text2);font-size:.95rem;align-items:center}
.pill{display:inline-block;border:1px solid color-mix(in srgb,var(--realm) 45%,#222);background:color-mix(in srgb,var(--realm) 8%,transparent);color:var(--gold2);border-radius:99px;padding:.15rem .8rem;font-size:.8rem}
.hero-cit{margin-top:1.1rem;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.05rem,3.4vw,1.3rem);color:color-mix(in srgb,var(--realm) 90%,var(--text));max-width:640px}

nav{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--bg4)}
nav .in{max-width:1000px;margin:0 auto;padding:.6rem clamp(1.2rem,4vw,2rem);display:flex;align-items:center;gap:1rem;font-size:.9rem}
nav a{color:var(--gold2);text-decoration:none}
nav a:hover{text-decoration:underline}
nav .lbl{margin-left:auto;color:var(--text3);font-size:.8rem}

main{max-width:1000px;margin:0 auto;padding:clamp(2rem,6vw,3rem) clamp(1.2rem,4vw,2rem)}
section{margin-bottom:clamp(2rem,5vw,2.8rem)}
h2{font-size:clamp(1.2rem,4vw,1.5rem);color:var(--gold2);margin-bottom:1rem;display:flex;align-items:center;gap:.6rem}
h2::before{content:'';width:5px;height:1.1em;background:var(--realm);border-radius:2px}
p{color:var(--text2)}
.card{background:var(--bg2);border:1px solid var(--bg3);border-radius:14px;padding:clamp(1.1rem,3vw,1.5rem)}
.card+.card{margin-top:1rem}
.status{margin-top:1rem;display:flex;gap:.8rem;flex-wrap:wrap}
.status .sq{background:var(--bg3);border:1px solid var(--bg4);border-radius:10px;padding:.6rem .9rem;flex:1;min-width:130px}
.status .k{font-size:.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.status .v{font-family:'Cinzel',serif;font-size:1.15rem;color:var(--gold2)}
ul.tick{list-style:none;margin-top:.6rem}
ul.tick li{padding:.3rem 0 .3rem 1.4rem;position:relative;color:var(--text2)}
ul.tick li::before{content:'✦';position:absolute;left:0;color:var(--realm);font-size:.8rem;top:.65rem}
ul.warn li::before{content:'⚠';font-size:.85rem}
.corrup{background:linear-gradient(120deg,color-mix(in srgb,var(--realm) 10%,var(--bg2)),var(--bg2));border:1px solid color-mix(in srgb,var(--realm) 35%,var(--bg4))}
.reflexo{margin-top:1rem;font-size:.9rem;color:var(--text2)}
.reflexo b{color:var(--gold2)}

/* Racas */
.racas{display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:640px){.racas{grid-template-columns:1fr 1fr}}
.raca{background:var(--bg2);border:1px solid var(--bg3);border-radius:14px;padding:1.2rem}
.raca h3{color:var(--gold2);font-size:1.05rem;margin-bottom:.3rem}
.raca .stats{font-size:.85rem;color:var(--realm);margin-bottom:.5rem}
.raca p{font-size:.9rem}
.raca ul{list-style:none;margin-top:.6rem}
.raca ul li{font-size:.85rem;color:var(--text2);padding:.18rem 0 .18rem 1.2rem;position:relative}
.raca ul li::before{content:'·';position:absolute;left:.2rem;color:var(--realm)}

/* Arquetipos */
.arqs{display:grid;grid-template-columns:1fr;gap:.7rem}
@media(min-width:640px){.arqs{grid-template-columns:1fr 1fr}}
.arq{display:flex;flex-direction:column;align-items:stretch;gap:.8rem;background:var(--bg2);border:1px solid var(--bg3);border-radius:12px;padding:.9rem 1.1rem}
.arq-head{display:flex;align-items:center;gap:.9rem}
.arq .aico{font-size:1.4rem}
.arq .acls{font-size:.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.arq .anome{font-family:'Cinzel',serif;color:var(--gold2);font-size:1rem}
.arq .adesc{font-size:.85rem;color:var(--text2)}
.arq-imgs{display:grid;grid-template-columns:1fr;gap:.5rem}
@media(min-width:480px){.arq-imgs{grid-template-columns:1fr 1fr}}
.arq-img img{width:100%;display:block;border-radius:10px;aspect-ratio:16/9;object-fit:cover}

/* Imagens */
.imgs{display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:640px){.imgs{grid-template-columns:1fr 1fr}}
.imgslot{border-radius:14px;overflow:hidden;background:var(--bg2);border:1px solid var(--bg3);position:relative;min-height:150px}
.imgslot img{width:100%;height:100%;display:block;object-fit:cover}
.imgs .imgslot{aspect-ratio:16/10}
.imgs .imgslot.port{aspect-ratio:3/4}
.imgslot.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;border:1px dashed var(--gold-dim);background:var(--bg2);color:var(--text3);padding:1rem;text-align:center;font-size:.78rem;font-family:ui-monospace,Consolas,monospace}
.imgslot.ph .phico{font-size:1.6rem}
.imgslot.ph .phfile{color:var(--gold2);word-break:break-all}
.imgslot img{cursor:zoom-in}
.arq-img img{cursor:zoom-in}
.imgslot:hover img,.arq-img:hover img{filter:brightness(1.15)}

/* Lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;padding:clamp(1rem,4vw,2.5rem);cursor:zoom-out}
.lb.open{display:flex}
.lb img{max-width:min(92vw,1200px);max-height:74vh;border-radius:10px;box-shadow:0 10px 50px rgba(0,0,0,.6);cursor:zoom-out}
.lb .cap{max-width:720px;text-align:center;color:var(--gold2);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1rem,3.4vw,1.15rem);margin-top:1rem;line-height:1.4}
.lb .close{position:absolute;top:1rem;right:1.4rem;background:none;border:none;color:var(--text2);font-size:1.8rem;cursor:pointer;line-height:1}
.lb .close:hover{color:#fff}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text2);font-size:2.6rem;cursor:pointer;padding:0 .6rem;line-height:1}
.lb .nav:hover{color:var(--gold2)}
.lb .nav.prev{left:.6rem}
.lb .nav.next{right:.6rem}
.lb .count{position:absolute;top:1rem;left:1.4rem;color:var(--text3);font-size:.82rem}

footer{padding:1.5rem;text-align:center;color:var(--text3);font-size:.85rem;border-top:1px solid var(--bg4)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="hero" class="hero">
  <div id="heroBg" class="hero-bg"></div>
  <div class="hero-ov"></div>
  <div class="hero-content">
    <div id="ico" class="hero-ico"></div>
    <h1 id="nome" class="hero-nome"></h1>
    <div id="sup" class="hero-sup"></div>
    <p id="cit" class="hero-cit"></p>
  </div>
</div>

<nav>
  <div class="in">
    <a href="index.html">Início</a> · <a href="reinos.html">Reinos</a>
    <span id="crumb" class="lbl"></span>
  </div>
</nav>

<main id="app"></main>

<div id="lb" class="lb">
  <button class="close" onclick="lbClose()" aria-label="Fechar">✕</button>
  <button class="nav prev" onclick="lbNav(-1)" aria-label="Anterior">‹</button>
  <img id="lbImg" alt="">
  <button class="nav next" onclick="lbNav(1)" aria-label="Próxima">›</button>
  <div class="cap" id="lbCap"></div>
  <div class="count" id="lbCount"></div>
</div>

<footer>Ecos da Luz © 2024</footer>

<script src="reinos-data.js"></script>
<script>
const params=new URLSearchParams(location.search);
const id=params.get('id')||'havendor';
const d=REINO_DATA.find(r=>r.id===id)||REINO_DATA[0];
const IMG_BASE='img/reinos/'+d.id+'/';
const realm=d.cor;

document.documentElement.style.setProperty('--realm',realm);
document.title=d.nome+' — '+d.virtude;

const $=s=>document.querySelector(s);
$('#ico').textContent=d.icone;
$('#nome').textContent=d.nome;
$('#cit').textContent=(d.citacao||d.frase)||'';
const supra=[d.virtude,d.atributo,d.group==='caos'?'Domínio do Caos':'Reino da Luz'];
$('#sup').innerHTML=supra.map(x=>'<span class="pill">'+x+'</span>').join('');
$('#crumb').textContent=d.nome+' — '+d.virtude;

const heroBg=$('#heroBg');
if(d.imgs){
  const heroFile=Object.keys(d.imgs)[0];
  const heroCap=d.imgs[heroFile];
  const img=new Image();
  img.onload=()=>{
    heroBg.style.backgroundImage='url('+IMG_BASE+heroFile+')';
    heroBg.classList.add('loaded');
    heroBg.dataset.caption=heroCap;
    heroBg.title=heroCap;
    heroBg.style.cursor='zoom-in';
    heroBg.onclick=()=>{
      const i=lbItems.findIndex(x=>x.src.includes(heroFile));
      lbCur=i<0?0:i;lbShow();
    };
    bindLb();
  };
  img.src=IMG_BASE+heroFile;
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function addImg(file,label,port){
  const box=document.createElement('div');
  box.className='imgslot'+(port?' port':'');
  const im=new Image();
  const ph=document.createElement('div');
  ph.className='imgslot ph';
  ph.innerHTML='<div class="phico">🖼️</div><div class="phfile">'+esc(IMG_BASE+file)+'</div><div>'+esc(label)+'</div>';
  box.appendChild(ph);
  im.onload=()=>{ph.replaceWith(im)};
  im.src=IMG_BASE+file;
  im.alt=label;
  im.dataset.caption=label;
  return box;
}

const lbItems=[];
function bindLb(){
  lbItems.length=0;
  document.querySelectorAll('img[data-caption]').forEach(im=>lbItems.push({src:im.currentSrc||im.src,caption:im.dataset.caption||'',alt:im.alt||''}));
}
let lbCur=0;
function lbOpen(im){
  bindLb();
  const i=lbItems.findIndex(x=>x.src===(im.currentSrc||im.src));
  lbCur=i<0?0:i;
  lbShow();
}
function lbShow(){
  const lb=document.querySelector('#lb');
  document.querySelector('#lbImg').src=lbItems[lbCur].src;
  document.querySelector('#lbImg').alt=lbItems[lbCur].alt;
  document.querySelector('#lbCap').textContent=lbItems[lbCur].caption;
  document.querySelector('#lbCount').textContent=lbItems.length>1?(lbCur+1)+' / '+lbItems.length:'';
  lb.classList.add('open');
}
function lbClose(){document.querySelector('#lb').classList.remove('open')}
function lbNav(d){
  lbCur=(lbCur+d+lbItems.length)%lbItems.length;
  lbShow();
}
document.addEventListener('click',e=>{
  const t=e.target.closest&&e.target.closest('img[data-caption]');
  if(t){e.preventDefault();e.stopPropagation();lbOpen(t);}
});
document.addEventListener('keydown',e=>{
  const lb=document.querySelector('#lb');
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')lbClose();
  else if(e.key==='ArrowRight')lbNav(1);
  else if(e.key==='ArrowLeft')lbNav(-1);
});

function section(title,html){return '<section><h2>'+title+'</h2>'+html+'</section>'}

let html='';

// Visão geral / cultura + lore
html+=section('Visão Geral','<div class="card"><p>'+esc(d.cultura)+'</p></div>'+
  '<div class="card"><h3 style="color:'+(d.group==='caos'?'var(--text)':'var(--gold2)')+';margin-bottom:.5rem">História</h3><p>'+esc(d.lore)+'</p>'+
  (d.fonte?'<div class="card" style="margin-top:1rem;background:var(--bg3)"><b style="color:var(--gold2)">Fonte de Poder — '+esc(d.fonte.nome)+':</b> <span>'+esc(d.fonte.desc)+'</span></div>':'')+
  '<div class="status">'+
  '<div class="sq"><div class="k">Passiva Global</div><div class="v" style="font-size:.95rem;font-family:Inter,serif;color:var(--text)">'+esc(d.passiva.nome)+'</div></div>'+
  '</div></div>');

html+=section('Passiva Global','<div class="card"><p>'+esc(d.passiva.desc)+'</p></div>');

// Vantagens / fraquezas
if(d.vantagens&&d.vantagens.length){
  let v='<div class="card"><h3 style="color:var(--gold2);margin-bottom:.5rem">✔ Vantagens</h3><ul class="tick">'+d.vantagens.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
  if(d.fraquezas&&d.fraquezas.length)v+='<div class="card"><h3 style="color:var(--text);margin-bottom:.5rem">⚠ Fraquezas</h3><ul class="tick warn">'+d.fraquezas.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
  html+=section('Forças & Limitações',v);
}

// Domínio do Caos
if(d.group==='caos'){
  let c='<div class="card">';
  if(d.corrupcao)c+='<h3 style="color:var(--gold2);margin-bottom:.5rem">A Corrupção</h3><p>'+esc(d.corrupcao)+'</p>';
  if(d.reflexo)c+='<p class="reflexo" style="margin-top:.8rem">Reflexo corrompido de: <b>'+esc(d.reflexo)+'</b></p>';
  c+='</div>';
  html+=section('O Preço do Domínio',c);
}

// Raças
if(d.racas&&d.racas.length){
  html+=section('Raças Nativa(s)','<div class="racas">'+d.racas.map(r=>'<div class="raca"><h3>'+r.icone+' '+esc(r.nome)+'</h3><div class="stats">'+esc(r.stats)+'</div><p>'+esc(r.desc)+'</p><ul>'+r.traits.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul></div>').join('')+'</div>');
}

// Arquétipos
html+=section('Arquétipos','<div class="arqs">'+d.arquetipos.map(a=>{
  const imgs=d.imgs?Object.entries(d.imgs).filter(([f,label])=>/^arquetipo-/.test(f)&&label.includes(a.nome)):[];
  return '<div class="arq"><div class="arq-head"><div class="aico">'+a.icone+'</div><div><div class="acls">'+esc(a.classe)+'</div><div class="anome">'+esc(a.nome)+'</div><div class="adesc">'+esc(a.desc)+'</div></div></div>'+
    (imgs.length?'<div class="arq-imgs">'+imgs.map(([f,label])=>'<div class="arq-img"><img src="'+IMG_BASE+f+'" alt="'+esc(label)+'" data-caption="'+esc(label)+'" onerror="this.closest(\'.arq-img\').remove()"></div>').join('')+'</div>':'')
  +'</div>';
}).join('')+'</div>');

// Imagens
if(d.imgs){
  const slots=Object.entries(d.imgs);
  const grid=document.createElement('div');
  grid.className='imgs';
  slots.filter(([f])=>!/^arquetipo-/.test(f)).forEach(([f,label])=>{
    const port=/raça|raca|retrato/i.test(label)&&!/exemplo/i.test(label)||/^raca-/.test(f);
    grid.appendChild(addImg(f,label,port));
  });
  document.querySelector('#app').innerHTML=html;
  document.querySelector('#app').appendChild(grid);
}else{
  document.querySelector('#app').innerHTML=html;
}
</script>
</body>
</html>
